<text x="40" y="308" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">11 × 11 = 121 vs 6 × 6 = 36：3.4 倍计算量</text>

<rect x="352" y="256" width="304" height="76" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="368" y="282" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#2C2C2A">Embedding 的参数量</text>
