<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img">
<title>粒度权衡：字符级与词级</title>
<desc>字符级词表小但序列长；词级序列短但词表没有上界且怕未登录词；子词级在两者之间。</desc>
<defs>
<marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">粒度权衡：字符级 vs 词级</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">所有 Tokenizer 都在这根轴上选一个点：V 多大，L 多长</text>

<line x1="40" y1="84" x2="636" y2="84" stroke="#888780" stroke-width="1.2" marker-end="url(#ar3)"/>
<text x="40" y="106" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">V 小、L 长</text>
<text x="640" y="106" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">V 大、L 短</text>

<rect x="24" y="122" width="196" height="112" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="146" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">字符级</text>
<text x="40" y="168" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">V = 几千</text>
<text x="40" y="188" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">L 暴涨</text>
<text x="40" y="208" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">单个字符几乎不</text>
<text x="40" y="224" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">携带语义</text>

<rect x="242" y="122" width="196" height="112" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="258" y="146" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#0C447C">子词级（BPE）</text>
<text x="258" y="168" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">V = 37k – 152k</text>
<text x="258" y="188" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">L 适中</text>
<text x="258" y="208" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#185FA5">无 OOV：新词由已</text>
<text x="258" y="224" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#185FA5">知碎片拼成</text>

<rect x="460" y="122" width="196" height="112" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="476" y="146" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">词级</text>
<text x="476" y="168" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">V 没有上界</text>
<text x="476" y="188" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">L 最短</text>
<text x="476" y="208" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">每个没见过的词</text>
<text x="476" y="224" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">都是 OOV 空洞</text>

<rect x="24" y="256" width="304" height="76" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="282" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#2C2C2A">Attention 的计算成本</text>
