<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img">
<title>从文本到 token ID：Tokenizer 在流水线中的位置</title>
<desc>原始文本先经 Tokenizer 切成 token，再映射为整数 ID，最后由 Embedding 表查成 d 维向量。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">从文本到 token ID：Tokenizer 在流水线中的位置</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">本篇负责前两步；把整数变成向量，是下一篇 Embedding 的事</text>

<rect x="24" y="78" width="112" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="80" y="100" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">原始文本</text>
<text x="80" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">一句话</text>

<rect x="154" y="78" width="112" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="210" y="100" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Tokenizer</text>
<text x="210" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#185FA5">按语料学到的合并规则</text>

<rect x="284" y="78" width="112" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="100" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Token IDs</text>
<text x="340" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#185FA5">L 个整数</text>

<rect x="414" y="78" width="112" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="470" y="100" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#3C3489">Embedding</text>
<text x="470" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#534AB7">V × d 的表里查行</text>

<rect x="544" y="78" width="112" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="600" y="100" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#3C3489">d 维向量</text>
<text x="600" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#534AB7">送进编码器</text>

<line x1="136" y1="106" x2="152" y2="106" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="266" y1="106" x2="282" y2="106" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="396" y1="106" x2="412" y2="106" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="526" y1="106" x2="542" y2="106" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>

<path d="M154 148 v6 h242 v-6" fill="none" stroke="#185FA5" stroke-width="1"/>
<text x="275" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#185FA5">本篇范围</text>
<path d="M414 148 v6 h242 v-6" fill="none" stroke="#534AB7" stroke-width="1"/>
<text x="535" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#534AB7">下一篇：Embedding</text>

<text x="24" y="200" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">例句：一句话 —— 6 个词，11 个 token</text>

<rect x="24" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">科</text>
<rect x="62" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="78" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">软</text>
<rect x="100" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="116" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">放</text>
<rect x="138" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="154" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">实</text>
<rect x="176" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="192" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">习</text>
<rect x="214" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="230" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">吸</text>
<rect x="252" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="268" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">引</text>
<rect x="290" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="306" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">学</text>
<rect x="328" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="344" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">生</text>
<rect x="366" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="382" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">报</text>
<rect x="404" y="212" width="32" height="30" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="420" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">考</text>

<path d="M24 252 v6 h70 v-6" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M100 252 v6 h32 v-6" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M138 252 v6 h70 v-6" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M214 252 v6 h70 v-6" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M290 252 v6 h70 v-6" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M366 252 v6 h70 v-6" fill="none" stroke="#888780" stroke-width="1"/>

<text x="466" y="228" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">6 个括号 = 6 个词</text>
<text x="466" y="246" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">11 个格子 = 11 个 token</text>
<text x="466" y="264" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#185FA5">L = 11，不是 6</text>
</svg>
