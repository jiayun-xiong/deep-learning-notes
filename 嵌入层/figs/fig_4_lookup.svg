<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img">
<title>查表等于 one-hot 乘矩阵，以及由此得到的稀疏梯度</title>
<desc>one-hot 向量乘嵌入矩阵等于取出对应行；反向传播时梯度只在被取到的行上非零。</desc>
<defs>
<marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">查表 = one-hot 乘矩阵 = 取第 i 行</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">实现上是索引，数学上是乘法；两种说法等价，梯度的稀疏性就从这里算出来</text>

