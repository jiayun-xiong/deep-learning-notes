<text x="24" y="352" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">one-hot 把整张梯度表清零，只留第 i 行</text>
<text x="24" y="370" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">11 个 token → 11 行被更新，其余行不动</text>
<text x="24" y="388" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#185FA5">37000 − 11 = 36989 行这一步梯度恰为 0</text>

