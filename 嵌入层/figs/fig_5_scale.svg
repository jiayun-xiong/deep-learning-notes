<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 398" width="680" height="398" role="img">
<title>乘根号 d 前后的能量配比</title>
<desc>不缩放时位置信号的平方范数与词向量同一量级，占输入能量三分之一；乘根号 d 后降到千分之一。</desc>
<defs>
<marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">为什么乘 √d：一次加法里的能量配比</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">论文只写了一句话，理由要从尺度算出来；下图取 d = 512</text>

<rect x="24" y="72" width="310" height="152" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="96" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">不缩放</text>
<rect x="40" y="112" width="187" height="34" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<rect x="227" y="112" width="93" height="34" fill="#BBD9F5" stroke="#185FA5" stroke-width="0.5"/>
<text x="133" y="134" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">‖E‖² ≈ 512</text>
<text x="273" y="134" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#0C447C">‖PE‖² ≈ 256</text>
<text x="40" y="170" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">位置信号占输入能量</text>
<text x="40" y="192" font-family="PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#0C447C">1/3 ≈ 33%</text>
<text x="40" y="212" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">位置信息与词信息平起平坐，容易盖过词</text>

<rect x="346" y="72" width="310" height="152" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="362" y="96" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">乘 √d 之后</text>
<rect x="362" y="112" width="276" height="34" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<rect x="638" y="112" width="2" height="34" fill="#185FA5"/>
<text x="500" y="134" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">‖√d·E‖² ≈ d² = 262144</text>
<text x="362" y="170" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">位置信号占输入能量</text>
<text x="362" y="192" font-family="PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#0C447C">1/(2d+1) ≈ 0.1%</text>
<text x="362" y="212" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">位置只做微调，不再与词信息抢量级</text>

<text x="24" y="262" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#2C2C2A">同一笔账写成式子（PE² 指 PE 的平方范数）</text>
