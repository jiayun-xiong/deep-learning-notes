<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" height="392" role="img">
<title>三处共享同一份嵌入矩阵，以及 ALBERT 的分解</title>
<desc>输入嵌入、输出嵌入与 pre-softmax 线性层共用同一个 V 乘 d 矩阵；ALBERT 把它拆成 V 乘 E 与 E 乘 d 两级。</desc>
<defs>
<marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">一张表，三处用：权重共享与嵌入分解</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">一张 37000 × 512 的表 = 1900 万参数，占 base 模型 6500 万的 29%</text>

<rect x="24" y="64" width="326" height="284" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="86" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">原始设计：三处共享一份参数</text>

<rect x="36" y="96" width="98" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="85" y="113" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0C447C">Input</text>
<text x="85" y="126" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0C447C">Embedding</text>

<rect x="140" y="96" width="98" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="189" y="113" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0C447C">Output</text>
<text x="189" y="126" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0C447C">Embedding</text>

<rect x="244" y="96" width="98" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="293" y="113" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#3C3489">Pre-softmax</text>
<text x="293" y="126" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#3C3489">Linear</text>

<line x1="85" y1="138" x2="124" y2="192" stroke="#888780" stroke-width="1.1" marker-end="url(#ar4)"/>
<line x1="189" y1="138" x2="189" y2="192" stroke="#888780" stroke-width="1.1" marker-end="url(#ar4)"/>
<line x1="293" y1="138" x2="258" y2="192" stroke="#888780" stroke-width="1.1" marker-end="url(#ar4)"/>

<rect x="56" y="196" width="276" height="86" rx="4" fill="#FAFAF7" stroke="#888780" stroke-width="0.6"/>
<line x1="56" y1="208" x2="332" y2="208" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="56" y1="220" x2="332" y2="220" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="56" y1="232" x2="332" y2="232" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="56" y1="244" x2="332" y2="244" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="56" y1="256" x2="332" y2="256" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="56" y1="268" x2="332" y2="268" stroke="#E3E1D8" stroke-width="0.5"/>
<rect x="56" y="232" width="276" height="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="300" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0C447C">同一份 E：V × d，37000 × 512 ≈ 1900 万参数</text>
<text x="56" y="318" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">输入查行、输出查行、输出层转置后乘，</text>
<text x="56" y="334" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">三个动作读写的都是同一块内存</text>

<rect x="364" y="64" width="292" height="284" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="380" y="86" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">ALBERT：先压到小维度再升回去</text>

<rect x="378" y="106" width="56" height="150" fill="#FAFAF7" stroke="#888780" stroke-width="0.6"/>
<line x1="378" y1="122" x2="434" y2="122" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="378" y1="138" x2="434" y2="138" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="378" y1="154" x2="434" y2="154" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="378" y1="170" x2="434" y2="170" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="378" y1="186" x2="434" y2="186" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="378" y1="202" x2="434" y2="202" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="378" y1="218" x2="434" y2="218" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="378" y1="234" x2="434" y2="234" stroke="#E3E1D8" stroke-width="0.5"/>
<text x="406" y="274" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">V × E</text>

<text x="452" y="212" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" fill="#5F5E5A">×</text>

<rect x="490" y="190" width="150" height="44" fill="#FAFAF7" stroke="#888780" stroke-width="0.6"/>
<line x1="490" y1="204" x2="640" y2="204" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="490" y1="218" x2="640" y2="218" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="528" y1="190" x2="528" y2="234" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="566" y1="190" x2="566" y2="234" stroke="#E3E1D8" stroke-width="0.5"/>
<line x1="604" y1="190" x2="604" y2="234" stroke="#E3E1D8" stroke-width="0.5"/>
<text x="565" y="254" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">E × d</text>

<text x="378" y="296" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">30522 × 128 ≈ 390 万</text>
<text x="378" y="314" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">128 × 768 ≈ 10 万</text>
<text x="378" y="334" font-family="PingFang SC, sans-serif" font-size="10" fill="#0C447C">合计 400 万，比 2340 万省 83%</text>

<text x="24" y="372" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">多模态时代：图像 patch 也过一层线性投影变成 token 向量 —— 维度与表结构不变，只是表的来源多了图像这一路。</text>
</svg>
