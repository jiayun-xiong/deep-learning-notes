<text x="243" y="446" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#185FA5">第 j 维：a_j × b_j</text>
<text x="243" y="464" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#185FA5">512 项全部相加 = 内积</text>

