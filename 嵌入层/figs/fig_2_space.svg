<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 496" width="680" height="496" role="img">
<title>token 的向量表示与余弦相似度</title>
<desc>苹果、梨、汽车三个词的向量取两维切片，苹果与梨同向、余弦 0.98，汽车偏离、余弦 -0.39；底卡说明高维空间无法绘制，内积是把每一维的乘积加起来。</desc>
<defs>
<marker id="arA2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arG2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">一个 token 的一行向量：每一维是一个抽象特征</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">真实是 d = 512 维；左卡只切出两维来画——只有二维画出来的角，才等于真角</text>

<rect x="24" y="66" width="356" height="268" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="90" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">只看两维：一个二维切片</text>

<line x1="92" y1="214" x2="356" y2="214" stroke="#B9B7AE" stroke-width="1" marker-end="url(#arG2)"/>
<line x1="150" y1="214" x2="150" y2="128" stroke="#B9B7AE" stroke-width="1" marker-end="url(#arG2)"/>
<text x="352" y="230" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">圆润度</text>
<text x="146" y="124" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">可食用度</text>
<circle cx="150" cy="214" r="2.5" fill="#5F5E5A"/>

<line x1="150" y1="214" x2="252.6" y2="149.2" stroke="#185FA5" stroke-width="1.6" marker-end="url(#arA2)"/>
<line x1="150" y1="214" x2="231" y2="138.4" stroke="#185FA5" stroke-width="1.6" marker-end="url(#arA2)"/>
<line x1="150" y1="214" x2="166.2" y2="308.5" stroke="#888780" stroke-width="1.6" marker-end="url(#arG2)"/>

<text x="258" y="146" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#0C447C">苹果 (0.95, 0.60)</text>
<text x="226" y="128" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#0C447C">梨 (0.75, 0.70)</text>
<text x="158" y="300" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#5F5E5A">汽车 (0.15, −0.90)</text>

<path d="M188.9 189.4 A46 46 0 0 0 183.6 182.6" fill="none" stroke="#185FA5" stroke-width="0.9"/>
<text x="202" y="199" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0C447C">11°</text>
<path d="M217.6 171.3 A80 80 0 0 1 163.1 292.9" fill="none" stroke="#888780" stroke-width="0.9" stroke-dasharray="3 2"/>
<text x="226" y="240" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">113°</text>

<text x="40" y="326" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">切片 = 只留两维，其余 510 维先不看</text>

<rect x="392" y="66" width="264" height="268" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="408" y="90" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">余弦值：只看方向</text>
<line x1="408" y1="100" x2="640" y2="100" stroke="#E3E1D8" stroke-width="1"/>

<text x="408" y="126" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">苹果 · 梨</text>
<text x="640" y="126" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">0.98</text>
<rect x="408" y="134" width="224" height="8" fill="#F1EFE8" stroke="#E3E1D8" stroke-width="0.5"/>
<rect x="520" y="134" width="110" height="8" fill="#185FA5"/>

<text x="408" y="168" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">苹果 · 汽车</text>
<text x="640" y="168" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#5F5E5A">−0.39</text>
<rect x="408" y="176" width="224" height="8" fill="#F1EFE8" stroke="#E3E1D8" stroke-width="0.5"/>
<rect x="476" y="176" width="44" height="8" fill="#888780"/>

<text x="408" y="210" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">梨 · 汽车</text>
<text x="640" y="210" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#5F5E5A">−0.55</text>
<rect x="408" y="218" width="224" height="8" fill="#F1EFE8" stroke="#E3E1D8" stroke-width="0.5"/>
<rect x="458" y="218" width="62" height="8" fill="#888780"/>

<line x1="408" y1="242" x2="632" y2="242" stroke="#B9B7AE" stroke-width="0.8"/>
<line x1="408" y1="238" x2="408" y2="246" stroke="#B9B7AE" stroke-width="0.8"/>
<line x1="520" y1="238" x2="520" y2="246" stroke="#B9B7AE" stroke-width="0.8"/>
<line x1="632" y1="238" x2="632" y2="246" stroke="#B9B7AE" stroke-width="0.8"/>
<text x="408" y="260" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">−1</text>
<text x="520" y="260" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">0</text>
<text x="632" y="260" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">+1</text>

<text x="408" y="286" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">词频高 → 向量被拉长，夹角不变</text>
<text x="408" y="304" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">所以只比方向，不比长度</text>
<text x="408" y="324" font-family="PingFang SC, sans-serif" font-size="10" fill="#185FA5">负值：方向偏离，比正交更远</text>

<rect x="24" y="348" width="632" height="136" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="372" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">d 维画不出来，只能算：内积 = 逐维相乘再相加</text>

<text x="44" y="402" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">a</text>
<text x="44" y="424" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">b</text>
