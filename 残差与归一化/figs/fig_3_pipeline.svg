<rect x="94.0" y="213" width="132" height="26" rx="8" fill="#FDEBE3" stroke="#C2410C" stroke-width="0.5"/>
<text x="160" y="230.0" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#C2410C">LN</text>
