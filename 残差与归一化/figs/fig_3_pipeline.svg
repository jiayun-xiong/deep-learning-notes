<line x1="340" y1="76" x2="340" y2="452" stroke="#D5D3CB" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="160" y="452" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#C2410C">残差线被 LN 挡住：每层都要穿一次</text>
<text x="160" y="468" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#C2410C">恒等项每层被 LN 的雅可比缩一次 → 必须 warmup</text>
<text x="510" y="452" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">残差线直连加号：全程裸加</text>
<text x="510" y="468" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">恒等项裸露 → 不用 warmup，末层补 LN</text>
</svg>
