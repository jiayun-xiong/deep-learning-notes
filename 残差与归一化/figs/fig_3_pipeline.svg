<text x="160" y="158.0" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">Attention</text>
<line x1="160" y1="176" x2="160" y2="190" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
