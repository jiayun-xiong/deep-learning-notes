<text x="510" y="266.0" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#C2410C">LN</text>
<line x1="510" y1="275" x2="510" y2="285" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="444.0" y="285" width="132" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
