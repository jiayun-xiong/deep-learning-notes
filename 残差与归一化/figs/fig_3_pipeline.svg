<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 486" width="680" height="486" role="img">
<title>两种排法：LN 站在加法前还是加法后</title>
<desc>左栏 Post-LN 把 LN 放在残差加法之后；右栏 Pre-LN 把 LN 移到子层入口，残差线直接连到加号。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">两种排法：LN 站在加法前还是加法后</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">模块清单完全相同，差别只有 LN 的位置和残差线从哪里分出去</text>
<text x="160" y="76" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#0C447C" font-weight="500">Post-LN（原始设计）</text>
<rect x="94.0" y="96" width="132" height="26" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
