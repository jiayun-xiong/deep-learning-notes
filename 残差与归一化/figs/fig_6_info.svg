<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" role="img">
<title>两个只差均值的 token，LN 之后分不出来</title>
<desc>左栏两个输入只差一个平移量，经过 LN 得到完全相同的输出；右栏同样两个输入经 RMSNorm 后输出仍不同，μ 被保留下来。</desc>
