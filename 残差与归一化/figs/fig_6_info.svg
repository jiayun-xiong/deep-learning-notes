<text x="505" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#04342C">r′ ≠ r，两个输出不同：μ 以 μ/r 的形式留在向量里</text>
<text x="24" y="282" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">所以“LN 拿不回 μ”不是没算好，是这个映射本身多对一：μ 落在它的零空间里，任何下游函数都分不开这两个输入。</text>
<text x="24" y="304" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">γ、β 也救不回来：它们是逐维参数，一组 γ 加一组 β 共 2d 个数，被所有 token 共用，装不下“每个 token 各一个 μ”。</text>
<text x="24" y="326" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">μ 是逐 token 的标量、每句话都在变；2d 个固定参数补不回一个随输入变的数。</text>
</svg>
