<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>LN 与 RMSNorm：一个做投影，一个只缩半径</title>
<desc>左右两个二维示意：左图点先被平移到零均值线，再缩到单位圆；右图点沿原方向缩到单位圆，方向不变。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#C2410C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">LN 与 RMSNorm：一个做投影，一个只缩半径</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">同样一个点，LN 先移到零均值超平面再缩放；RMSNorm 沿射线直接缩到单位球</text>
<line x1="60" y1="230" x2="276" y2="230" stroke="#C9C7BF" stroke-width="1.0"/>
<line x1="168" y1="326" x2="168" y2="134" stroke="#C9C7BF" stroke-width="1.0"/>
<circle cx="168" cy="230" r="74" fill="none" stroke="#888780" stroke-width="0.7" stroke-dasharray="3,3"/>
<line x1="72" y1="134" x2="264" y2="326" stroke="#C9C7BF" stroke-width="1.0" stroke-dasharray="2,3"/>
<svg x="80.0" y="118.8" width="54.9" height="8.8" viewBox="0 0 5781 923"><g fill="currentColor" stroke-width="0" transform="translate(0 753.5) scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msub"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g><g data-mml-node="mn" transform="translate(605,-150) scale(0.744)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g><g data-mml-node="mo" transform="translate(1249.4,0)"><path data-c="2B" d="M56 237T56 250T70 270H369V420L370 570Q380 583 389 583Q402 583 409 568V270H707Q722 262 722 250T707 230H409V-68Q401 -82 391 -82H389H387Q375 -82 369 -68V230H70Q56 237 56 250Z"></path></g><g data-mml-node="msub" transform="translate(2249.7,0)"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g><g data-mml-node="mn" transform="translate(605,-150) scale(0.744)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g><g data-mml-node="mo" transform="translate(3554.6,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mn" transform="translate(4610.4,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></svg>
<text x="168" y="84" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#2C2C2A" font-weight="500">LN：先减均值，再除以 σ</text>
<line x1="404" y1="230" x2="620" y2="230" stroke="#C9C7BF" stroke-width="1.0"/>
<line x1="512" y1="326" x2="512" y2="134" stroke="#C9C7BF" stroke-width="1.0"/>
<circle cx="512" cy="230" r="74" fill="none" stroke="#888780" stroke-width="0.7" stroke-dasharray="3,3"/>
<text x="512" y="84" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#2C2C2A" font-weight="500">RMSNorm：只除以 r</text>
<line x1="282.7" y1="152.3" x2="186.5" y2="248.5" stroke="#C2410C" stroke-width="1.2" marker-end="url(#ao)"/>
<line x1="186.5" y1="248.5" x2="220.3254" y2="282.3254" stroke="#185FA5" stroke-width="1.2" marker-end="url(#ar)"/>
<circle cx="282.7" cy="152.3" r="3.4" fill="#C2410C"/>
<circle cx="186.5" cy="248.5" r="3.4" fill="#C2410C"/>
<circle cx="220.3254" cy="282.3254" r="3.4" fill="#185FA5"/>
<text x="290.7" y="144.3" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#C2410C">x</text>
<text x="194.5" y="262.5" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.6" fill="#C2410C">x − μ</text>
<text x="230.3254" y="286.3254" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.6" fill="#0C447C">÷ σ</text>
<text x="174" y="160" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="8.6" fill="#5F5E5A">1</text>
<line x1="626.7" y1="152.3" x2="573.2659830961366" y2="188.49723725745588" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#ag)"/>
<circle cx="626.7" cy="152.3" r="3.4" fill="#C2410C"/>
<circle cx="573.2659830961366" cy="188.49723725745588" r="3.4" fill="#1D9E75"/>
<text x="634.7" y="144.3" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#C2410C">x</text>
<text x="583.2659830961366" y="192.49723725745588" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.6" fill="#04342C">÷ r</text>
<text x="518" y="160" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="8.6" fill="#5F5E5A">1</text>
<text x="24" y="344" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#C2410C">LN：丢掉 μ 与 σ 两个逐 token 的标量，强制零均值单位方差</text>
<text x="24" y="362" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">RMSNorm：只丢掉 r，方向与相对大小都留给后续线性层</text>
<text x="24" y="384" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">两者只差一个标量因子 σ/r 与一个偏移 β——这就是“去掉均值不掉点”的形式来源</text>
</svg>
