<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" width="680" height="396" role="img">
<title>残差与归一化：一层里各管一件事</title>
<desc>上半部分是 Pre-LN block 的横向流水线（今天通行；Transformer 原文为 Post-LN，LN 在加号之后），绿色弧线是残差；下半部分三张卡片说明残差管结构、归一化管数值、顺序之争决定训练稳定性。</desc>
<defs>
