<polyline points="42,109 42,76 272,76 272,112" fill="none" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#ag)" stroke-linejoin="round"/>
<text x="150" y="70" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">残差：加法绕过子层</text>
<polyline points="272,140 272,178 473,178 473,140" fill="none" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#ag)" stroke-linejoin="round"/>
<text x="372" y="194" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">再一次：只加增量</text>
<text x="566" y="118" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">一层</text>
<text x="566" y="132" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">（Pre-LN）</text>
<text x="566" y="146" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">原文 Post-LN</text>
<rect x="24" y="222" width="200" height="112" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="36" y="244" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C" font-weight="500">残差 = 结构问题：怎么合</text>
<circle cx="38" cy="266" r="1.8" fill="#04342C"/>
<text x="46" y="270" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.8" fill="#04342C">加法总线：只增不改</text>
<circle cx="38" cy="286" r="1.8" fill="#04342C"/>
<text x="46" y="290" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.8" fill="#04342C">恒等映射 = 权重置零</text>
<circle cx="38" cy="306" r="1.8" fill="#04342C"/>
<text x="46" y="310" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.8" fill="#04342C">梯度有系数 1 的直通路</text>
<rect x="240" y="222" width="200" height="112" rx="8" fill="#FDEBE3" stroke="#C2410C" stroke-width="0.5"/>
<text x="252" y="244" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="11" fill="#C2410C" font-weight="500">归一化 = 数值问题：多大量</text>
<circle cx="254" cy="266" r="1.8" fill="#C2410C"/>
<text x="262" y="270" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.8" fill="#C2410C">把每层输入尺度钉回 1</text>
<circle cx="254" cy="286" r="1.8" fill="#C2410C"/>
<text x="262" y="290" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.8" fill="#C2410C">删掉“尺度”这个自由度</text>
<circle cx="254" cy="306" r="1.8" fill="#C2410C"/>
<text x="262" y="310" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.8" fill="#C2410C">只剩方向要学</text>
<rect x="456" y="222" width="200" height="112" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="468" y="244" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C" font-weight="500">顺序之争 = 稳定性</text>
<circle cx="470" cy="266" r="1.8" fill="#0C447C"/>
<text x="478" y="270" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.8" fill="#0C447C">Post-LN：路径被 LN 打断</text>
<circle cx="470" cy="286" r="1.8" fill="#0C447C"/>
<text x="478" y="290" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.8" fill="#0C447C">Pre-LN：恒等项裸露</text>
<circle cx="470" cy="306" r="1.8" fill="#0C447C"/>
<text x="478" y="310" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.8" fill="#0C447C">RMSNorm：省掉均值</text>
<text x="24" y="368" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">残差：允许累加　　归一化：累加后重新标定　　缺一个都堆不深</text>
</svg>
