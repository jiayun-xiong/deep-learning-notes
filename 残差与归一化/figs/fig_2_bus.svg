<text x="380" y="106" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#04342C" font-weight="500">Residual Stream</text>
<text x="380" y="136" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#04342C">· 只增不改</text>
<text x="388" y="151" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.4" fill="#5F5E5A">子层只能提交增量，无权替换</text>
<text x="380" y="182" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#04342C">· 不衰减</text>
<text x="388" y="197" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.4" fill="#5F5E5A">起点向量原样躺在终点里，任何层都能读到</text>
<text x="380" y="228" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#04342C">· 尺度由增量决定</text>
<text x="388" y="243" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.4" fill="#5F5E5A">写多少完全看 F 的输出大小</text>
<line x1="380" y1="274" x2="656" y2="274" stroke="#D5D3CB" stroke-width="1.0"/>
<text x="380" y="298" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.2" fill="#04342C">绿线 = 恒等通路：系数恒为 1</text>
<text x="388" y="313" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.4" fill="#5F5E5A">梯度沿它回传，一格都不缩</text>
<text x="380" y="344" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.2" fill="#C2410C">代价：范数随 N 单调涨</text>
<text x="388" y="359" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.4" fill="#5F5E5A">所以要靠后续 LN 每层重新标定</text>
<text x="380" y="386" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.4" fill="#5F5E5A">这是第 3 节的全部依据</text>
