<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 518" width="680" height="518" role="img">
<title>残差流是一条只增不改的总线</title>
<desc>左侧竖线是残差流，每个子层从主流分叉、算完把增量加回主流；右侧说明三个推论与恒等通路。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">残差流是一条只增不改的总线</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">每个子层从主流读一次、算完把增量加回去；主流本身从不被覆盖</text>
