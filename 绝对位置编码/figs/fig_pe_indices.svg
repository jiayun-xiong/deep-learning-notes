<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img">
<title>位置编码矩阵的两个索引</title>
<desc>位置编码矩阵 P 的行索引是位置 i（第几个 token），列索引是维度对 j（第 2j、2j+1 维），P[i][j] 是这两个索引的函数。</desc>

<text x="26" y="26" font-family="PingFang SC, sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">两个索引：位置 i 是输入，维度对 j 是"编码槽位"</text>

<!-- 中央矩阵 -->
<rect x="176" y="56" width="328" height="190" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
<g stroke="#185FA5" stroke-width="0.5" opacity="0.35">
  <line x1="176" y1="104" x2="504" y2="104"/>
  <line x1="176" y1="152" x2="504" y2="152"/>
  <line x1="176" y1="200" x2="504" y2="200"/>
  <line x1="258" y1="56" x2="258" y2="246"/>
  <line x1="340" y1="56" x2="340" y2="246"/>
  <line x1="422" y1="56" x2="422" y2="246"/>
</g>
<g font-family="Menlo, monospace" font-size="12.5" text-anchor="middle" fill="#0C447C">
  <text x="217" y="86">P[0][0]</text><text x="299" y="86">P[0][1]</text><text x="381" y="86">P[0][2]</text><text x="463" y="86">…</text>
  <text x="217" y="134">P[1][0]</text><text x="299" y="134">P[1][1]</text><text x="381" y="134">P[1][2]</text><text x="463" y="134">…</text>
  <text x="217" y="182">P[2][0]</text><text x="299" y="182">P[2][1]</text><text x="381" y="182">P[2][2]</text><text x="463" y="182">…</text>
  <text x="217" y="228">⋮</text><text x="299" y="228">⋮</text><text x="381" y="228">⋮</text><text x="463" y="228">⋱</text>
</g>
<text x="340" y="272" font-family="PingFang SC, sans-serif" font-size="12" text-anchor="middle" fill="#0C447C">P 的形状 (L, 512)：每一行 = 一个 token 的 512 维位置向量</text>

<!-- 左：位置 i -->
<line x1="146" y1="56" x2="146" y2="246" stroke="#D85A30" stroke-width="1.4" marker-end="url(#arrW)" fill="none"/>
<g font-family="PingFang SC, sans-serif" text-anchor="middle">
  <text x="96" y="140" font-size="13" font-weight="600" fill="#993C1D">位置 i（行）</text>
  <text x="96" y="162" font-size="12" fill="#712B13">第几个 token</text>
  <text x="96" y="180" font-size="12" fill="#712B13">0, 1, 2, …, L−1</text>
  <text x="96" y="202" font-size="11.5" fill="#5F5E5A">同一个词出现在</text>
  <text x="96" y="218" font-size="11.5" fill="#5F5E5A">不同位置，靠它区分</text>
</g>

<!-- 下：维度对 j -->
<line x1="176" y1="286" x2="504" y2="286" stroke="#639922" stroke-width="1.4" marker-end="url(#arrW2)" fill="none"/>
<g font-family="PingFang SC, sans-serif" text-anchor="middle">
  <text x="340" y="308" font-size="13" font-weight="600" fill="#3B6D11">维度对 j（列）</text>
  <text x="340" y="328" font-size="12" fill="#27500A">512 维拆成 256 对，第 j 对占用第 2j、2j+1 维</text>
  <text x="340" y="346" font-size="11.5" fill="#5F5E5A">每对有专属频率 θj：j 小翻得快（低位/秒针），j 大翻得慢（高位/时针）</text>
</g>

