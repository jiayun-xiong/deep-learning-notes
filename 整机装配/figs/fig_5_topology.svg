<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img">
<title>三种拓扑：判据是输出是不是另一条完整序列</title>
<desc>左：编码器加解码器，两栈之间有交叉注意力接口；中：只有解码器栈；右：只有编码器栈，输出是向量表示。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">三种拓扑：同一套零件，三种拼法</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">判据只有一条：输出是不是另一条完整的、长度独立的序列</text>

<!-- 面板 A：encoder-decoder -->
<rect x="24" y="64" width="204" height="226" rx="8" fill="#FAFAF7" stroke="#D5D3CB" stroke-width="0.5"/>
<text x="126" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">encoder-decoder</text>
<text x="126" y="102" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">翻译 / 摘要 / 语音识别</text>

<rect x="140" y="114" width="70" height="28" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.7"/>
<text x="175" y="132" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#04342C">下一个词</text>

<rect x="44" y="166" width="70" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="79" y="185" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0C447C">Encoder ×N</text>

<rect x="140" y="166" width="70" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
<text x="175" y="185" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#3C3489">Decoder ×N</text>

<line x1="114" y1="181" x2="140" y2="181" stroke="#534AB7" stroke-width="1.3" marker-end="url(#ap)"/>
<text x="127" y="174" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8.5" fill="#3C3489">K,V</text>

<line x1="175" y1="166" x2="175" y2="144" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>

<rect x="44" y="222" width="70" height="26" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="79" y="239" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#2C2C2A">源句 tokens</text>
<rect x="140" y="222" width="70" height="26" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="175" y="239" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#2C2C2A">已译前缀</text>

<line x1="79" y1="222" x2="79" y2="198" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>
<line x1="175" y1="222" x2="175" y2="198" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>

<text x="126" y="276" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">两栈之间必须有一个接口</text>

<!-- 面板 B：decoder-only -->
<rect x="246" y="64" width="192" height="226" rx="8" fill="#FAFAF7" stroke="#D5D3CB" stroke-width="0.5"/>
<text x="342" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">decoder-only</text>
<text x="342" y="102" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">对话 / 续写 / 代码（今天的 LLM）</text>

<rect x="306" y="114" width="72" height="28" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.7"/>
<text x="342" y="132" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#04342C">下一个词</text>

<rect x="306" y="166" width="72" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
<text x="342" y="185" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#3C3489">Decoder ×N</text>

<line x1="342" y1="166" x2="342" y2="144" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>

<rect x="306" y="222" width="72" height="26" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="342" y="239" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#2C2C2A">前缀 tokens</text>

<line x1="342" y1="222" x2="342" y2="198" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>

<text x="342" y="276" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">没有接口，省下的参数加深堆叠</text>

<!-- 面板 C：encoder-only -->
<rect x="456" y="64" width="200" height="226" rx="8" fill="#FAFAF7" stroke="#D5D3CB" stroke-width="0.5"/>
<text x="556" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">encoder-only</text>
<text x="556" y="102" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">分类 / 检索 / 句向量</text>

<rect x="520" y="114" width="72" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="556" y="132" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#0C447C">向量表示</text>

<rect x="520" y="166" width="72" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="556" y="185" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0C447C">Encoder ×N</text>

<line x1="556" y1="166" x2="556" y2="144" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>

<rect x="520" y="222" width="72" height="26" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="556" y="239" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#2C2C2A">句子 tokens</text>

<line x1="556" y1="222" x2="556" y2="198" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>

<text x="556" y="276" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">不生成序列，只要一个表示</text>

<text x="24" y="318" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">结构账：编码器块 12d²，解码器块 16d²（多一块交叉注意力）。encoder-decoder 整机 28d²；decoder-only 把省下的那部分全部投进更深的堆叠。</text>
<text x="24" y="336" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">代价：两栈可以让"输入只读一次"，decoder-only 的 KV cache 随长度线性增长，长上下文推理时成为主瓶颈。</text>
</svg>
