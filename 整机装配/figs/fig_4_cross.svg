<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img">
<title>交叉注意力的形状与两份缓存</title>
<desc>左侧：Q 来自解码器状态 S，K 与 V 来自编码器输出 H，分数矩阵为 m×n。右侧：自注意力缓存随步增长，交叉注意力缓存写满后只读。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">交叉注意力：一根箭头，两种缓存</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">Q 决定"我在写第几个词"，K 与 V 决定"源句里有哪些内容可抄"</text>

<!-- 左：形状 -->
<rect x="24" y="66" width="326" height="252" rx="8" fill="#FAFAF7" stroke="#D5D3CB" stroke-width="0.5"/>
<text x="40" y="88" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">左侧：分数矩阵为什么是长方形</text>

<rect x="40" y="100" width="104" height="32" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/>
<text x="92" y="120" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">S：m × d</text>
<text x="92" y="146" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">解码器状态</text>

<rect x="40" y="176" width="104" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="92" y="196" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#0C447C">H：n × d</text>
<text x="92" y="222" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">编码器输出（共用一份）</text>

<rect x="176" y="100" width="62" height="32" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="207" y="120" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">W_Q</text>

<rect x="176" y="176" width="62" height="32" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="207" y="196" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">W_K, W_V</text>

<line x1="144" y1="116" x2="176" y2="116" stroke="#534AB7" stroke-width="1.2" marker-end="url(#ap)"/>
<line x1="144" y1="192" x2="176" y2="192" stroke="#185FA5" stroke-width="1.2" marker-end="url(#ar)"/>

<rect x="256" y="132" width="78" height="44" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.8"/>
<text x="295" y="151" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">Q·Kᵀ</text>
<text x="295" y="166" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">m × n</text>

<path d="M238 116L248 116Q256 116 256 124L256 140" fill="none" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>
<path d="M238 192L248 192Q256 192 256 184L256 168" fill="none" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>

<text x="302" y="192" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">行 = 译出位置</text>
<text x="302" y="207" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">列 = 源句位置</text>
<text x="40" y="248" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">· 无 mask：源句是已知条件，没有"未来"要挡</text>
<text x="40" y="266" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">· 宽度仍回到 d：乘 V 之后是 m × d，残差加得起来</text>
<text x="40" y="284" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">· 代价：解码器块因此比编码器块厚三分之一</text>
<text x="40" y="302" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">· "对齐"只是教学解读，论文没有这样描述</text>

<!-- 右：两份缓存 -->
<rect x="364" y="66" width="292" height="252" rx="8" fill="#FAFAF7" stroke="#D5D3CB" stroke-width="0.5"/>
<text x="380" y="88" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#04342C">右侧：两份 cache 增长方式不同</text>

<text x="380" y="114" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">自注意力 cache：每步追加一行</text>
<rect x="380" y="122" width="22" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<rect x="402" y="122" width="22" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<rect x="424" y="122" width="22" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<rect x="446" y="122" width="22" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<rect x="468" y="122" width="22" height="26" fill="#E8E6DF" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="479" y="140" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">新</text>
<text x="380" y="166" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">t = 0 … 3 已缓存，第 4 步只算新增这一行</text>

<text x="380" y="200" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">交叉注意力 cache：写满后只读</text>
<rect x="380" y="208" width="110" height="26" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="435" y="226" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0C447C">n 行，全程不变</text>
<text x="380" y="252" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">生成开始前一次算好，之后每步只读不写</text>

<text x="380" y="282" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">两份分开算，显存账才不混：带宽优化的对象是左边这份，</text>
<text x="380" y="298" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">它随长度线性涨；右边这份只跟源句长度有关。</text>
</svg>
