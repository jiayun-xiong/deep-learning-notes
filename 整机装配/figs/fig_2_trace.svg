<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img">
<title>一行 token 的全程：从 id 2916 到 0.71</title>
<desc>以例句中的「报」为例，画出同一行在六站之间形状与数值的变化：1 个整数、512 维向量、11 个注意力权重、512 维上下文向量、37000 个 logits、一个分布。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">一行 token 的全程：从 id 2916 到 0.71</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">例句里的「报」走完整机，形状只在这一行的首尾两站改变</text>

<!-- 形状标签 -->
<text x="70" y="80" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">1 个整数</text>
<text x="180" y="80" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">512 维</text>
<text x="290" y="80" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">11 个权重</text>
<text x="400" y="80" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">512 维</text>
<text x="510" y="80" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">37000 维</text>
<text x="620" y="80" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">和为 1</text>

<!-- 节点 1 -->
<rect x="24" y="92" width="92" height="84" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/>
<text x="70" y="128" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">id 2916</text>
<text x="70" y="146" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">词表里的编号</text>

<!-- 节点 2 -->
<rect x="134" y="92" width="92" height="84" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="180" y="120" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">查表取第 2916 行</text>
<text x="180" y="138" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">加上 pos = 9 的向量</text>
<text x="180" y="158" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">宽度仍是 512</text>

<!-- 节点 3 -->
<rect x="244" y="92" width="92" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="290" y="108" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">Attention 权重</text>
<text x="290" y="126" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0C447C">科 0.18　生 0.14</text>
<text x="290" y="143" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0C447C">吸 0.12　其余 0.56</text>
<text x="290" y="162" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">相加恰好为 1</text>

<!-- 节点 4 -->
<rect x="354" y="92" width="92" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="400" y="122" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#0C447C">H 的第 9 行</text>
<text x="400" y="142" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">已混入全句信息的</text>
<text x="400" y="157" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">512 个数</text>

<!-- 节点 5 -->
<rect x="464" y="92" width="92" height="84" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.8"/>
<text x="510" y="112" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#04342C">Output Head 打分</text>
<text x="510" y="130" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#04342C">考 8.4　销 5.5</text>
<text x="510" y="147" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#04342C">研 5.2　其余更低</text>
<text x="510" y="165" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">logits，可正可负</text>

<!-- 节点 6 -->
<rect x="574" y="92" width="92" height="84" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="620" y="114" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#3C3489">考 0.71</text>
<text x="620" y="132" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#3C3489">销 0.04　研 0.03</text>
<text x="620" y="149" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#3C3489">其余 0.22</text>
<text x="620" y="166" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">下一步的输入</text>

<!-- 箭头 -->
<line x1="116" y1="134" x2="132" y2="134" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="226" y1="134" x2="242" y2="134" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="336" y1="134" x2="352" y2="134" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="446" y1="134" x2="462" y2="134" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="556" y1="134" x2="572" y2="134" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>

<!-- 站点说明 -->
<text x="70" y="194" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8.5" fill="#5F5E5A">Tokenizer 输出</text>
<text x="180" y="194" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8.5" fill="#5F5E5A">Embedding + Position</text>
<text x="290" y="194" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8.5" fill="#5F5E5A">11 行加权成 1 行</text>
<text x="400" y="194" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8.5" fill="#5F5E5A">编码器出口</text>
<text x="510" y="194" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8.5" fill="#5F5E5A">解码器出口打分</text>
<text x="620" y="194" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8.5" fill="#5F5E5A">Softmax 再挑一个</text>

<!-- 底部说明 -->
<line x1="24" y1="212" x2="656" y2="212" stroke="#D3D1C7" stroke-width="0.6"/>
<text x="24" y="234" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">同一套权重、同一段代码处理全部 11 行；行与行的差别只来自三件事——自己是谁（第 2 站）、能看见谁（因果 mask）、</text>
<text x="24" y="250" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">从另一条序列借到了什么（交叉注意力）。第 4 站与第 5 站之间，这一行还要经过解码器的 6 层（整机地图的 ⑥⑦⑧），</text>
<text x="24" y="266" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">所以第 5 站打分的已经是解码器出口的「报」行，不是第 4 站的 H。从第 2 站到第 4 站宽度始终是 512；</text>
<text x="24" y="282" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">第 5 站摊成 37000、第 6 站压回一个分布——加上第 2 站的查表，整机的两处变形这一行占全了。</text>
<text x="24" y="304" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">数值为演示值：真实模型的权重不会这么整齐，但形状、和为 1、以及「摊开再压回」的顺序从不改变。</text>
</svg>
