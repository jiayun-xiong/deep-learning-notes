<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620" role="img">
<title>走查地图：11 个 token 的整机路线</title>
<desc>左栈编码器、右栈解码器，① 到 ⑩ 标出一次完整走查的十个站点；圆角框是重复 N 次的块，Linear 与 Softmax 在块外；每个子层带一条残差弧；两栈的 Positional Encoding 都从侧面以 ⊕ 加到主干上。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">走查地图：11 个 token 的整机路线</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">布局照 Vaswani et al. (2017) Figure 1；圆标 ①–⑩ 是正文的走查顺序</text>

<!-- ============ 编码器列 ============ -->
<text x="160" y="74" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Encoder</text>

<circle cx="34" cy="107" r="9" fill="#0C447C"/>
<text x="34" y="110.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF">5</text>
<rect x="72" y="84" width="176" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="160" y="103" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">H：编码器输出</text>
<text x="160" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">11 × 512，只算这一次</text>

<!-- 编码器块容器：重复 N 次 -->
<rect x="48" y="140" width="224" height="196" rx="14" fill="#F7F5EE" stroke="#888780" stroke-width="0.8"/>
<text x="54" y="330" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">× N</text>

<rect x="72" y="148" width="176" height="30" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="160" y="167" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">Add &amp; Norm</text>

<rect x="72" y="186" width="176" height="34" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.8"/>
<text x="160" y="208" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">Feed Forward</text>

<rect x="72" y="228" width="176" height="30" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="160" y="247" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">Add &amp; Norm</text>

<circle cx="34" cy="289" r="9" fill="#0C447C"/>
<text x="34" y="292.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF">4</text>
<rect x="72" y="266" width="176" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="160" y="285" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">Multi-Head Attention</text>
<text x="160" y="301" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">Q K V 都来自编码器，无 mask</text>

<!-- 编码器：位置编码从侧面相加（块外） -->
<circle cx="160" cy="372" r="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/>
<line x1="150" y1="372" x2="170" y2="372" stroke="#534AB7" stroke-width="1.1"/>
<line x1="160" y1="362" x2="160" y2="382" stroke="#534AB7" stroke-width="1.1"/>
<rect x="288" y="358" width="74" height="28" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="325" y="369" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#3C3489">Positional</text>
<text x="325" y="380" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#3C3489">Encoding</text>
<line x1="288" y1="372" x2="172" y2="372" stroke="#534AB7" stroke-width="1.1" marker-end="url(#av)"/>
<circle cx="325" cy="402" r="9" fill="#534AB7"/>
<text x="325" y="405.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF">3</text>

<circle cx="34" cy="406" r="9" fill="#534AB7"/>
<text x="34" y="409.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF">2</text>
<rect x="72" y="390" width="176" height="32" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="160" y="411" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">Embedding</text>

<circle cx="34" cy="448" r="9" fill="#534AB7"/>
<text x="34" y="451.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF">1</text>
<text x="72" y="452" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">Inputs：11 个 token id</text>

<!-- 编码器主干箭头 -->
<line x1="160" y1="444" x2="160" y2="424" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="160" y1="390" x2="160" y2="384" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="160" y1="362" x2="160" y2="314" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="160" y1="266" x2="160" y2="260" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="160" y1="228" x2="160" y2="222" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="160" y1="186" x2="160" y2="180" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="160" y1="148" x2="160" y2="132" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<!-- 编码器残差弧：子层输入从右侧绕到上方的 Add & Norm -->
<path d="M160 322L254 322Q262 322 262 314L262 251Q262 243 254 243L248 243" fill="none" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>
<path d="M160 224L254 224Q262 224 262 216L262 171Q262 163 254 163L248 163" fill="none" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>

<!-- ============ 解码器列 ============ -->
<text x="487" y="54" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#3C3489">Decoder</text>

<rect x="388" y="64" width="198" height="26" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="487" y="82" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">Output Probabilities：11 个分布</text>

<circle cx="364" cy="113" r="9" fill="#534AB7"/>
<text x="364" y="116.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF">10</text>
<rect x="388" y="100" width="198" height="26" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="487" y="118" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#3C3489">Softmax</text>

<circle cx="364" cy="149" r="9" fill="#1D9E75"/>
<text x="364" y="152.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF">9</text>
<rect x="388" y="136" width="198" height="26" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.8"/>
<text x="487" y="154" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#04342C">Linear：d → V（11 × 37000）</text>

<!-- 解码器块容器：重复 N 次 -->
<rect x="376" y="172" width="228" height="274" rx="14" fill="#F7F5EE" stroke="#888780" stroke-width="0.8"/>
<text x="382" y="442" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">× N</text>

<rect x="388" y="180" width="198" height="28" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="487" y="199" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">Add &amp; Norm</text>

<rect x="388" y="216" width="198" height="34" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.8"/>
<text x="487" y="238" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">Feed Forward</text>

<rect x="388" y="258" width="198" height="28" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="487" y="277" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">Add &amp; Norm</text>

<circle cx="364" cy="317" r="9" fill="#534AB7"/>
<text x="364" y="320.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF">8</text>
<rect x="388" y="294" width="198" height="46" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="487" y="313" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#3C3489">Cross Attention</text>
<text x="487" y="329" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">Q 来自解码器，K V 来自 H，无 mask</text>

<rect x="388" y="348" width="198" height="28" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="487" y="367" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">Add &amp; Norm</text>

<circle cx="364" cy="407" r="9" fill="#534AB7"/>
<text x="364" y="410.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF">7</text>
<rect x="388" y="384" width="198" height="46" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="487" y="403" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#3C3489">Masked Multi-Head Attention</text>
<text x="487" y="419" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">因果 mask：只能看见 j ≤ i</text>

<!-- 解码器：位置编码从侧面相加（块外） -->
<circle cx="487" cy="472" r="10" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.2"/>
<line x1="477" y1="472" x2="497" y2="472" stroke="#534AB7" stroke-width="1.1"/>
<line x1="487" y1="462" x2="487" y2="482" stroke="#534AB7" stroke-width="1.1"/>
<rect x="612" y="458" width="64" height="28" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="644" y="469" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8.5" fill="#3C3489">Positional</text>
<text x="644" y="480" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8.5" fill="#3C3489">Encoding</text>
<line x1="612" y1="472" x2="499" y2="472" stroke="#534AB7" stroke-width="1.1" marker-end="url(#av)"/>

<circle cx="364" cy="510" r="9" fill="#534AB7"/>
<text x="364" y="513.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF">6</text>
<rect x="388" y="494" width="198" height="32" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="487" y="515" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">Output Embedding（右移一位）</text>

<text x="487" y="556" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">Outputs：已生成的前缀，共 11 个位置</text>

<!-- 解码器主干箭头 -->
<line x1="487" y1="100" x2="487" y2="92" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="487" y1="136" x2="487" y2="128" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="487" y1="180" x2="487" y2="164" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="487" y1="216" x2="487" y2="210" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="487" y1="258" x2="487" y2="252" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="487" y1="294" x2="487" y2="288" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="487" y1="348" x2="487" y2="342" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="487" y1="384" x2="487" y2="378" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="487" y1="462" x2="487" y2="432" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="487" y1="494" x2="487" y2="484" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<!-- 解码器残差弧 -->
<path d="M487 440L588 440Q596 440 596 432L596 370Q596 362 588 362L586 362" fill="none" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>
<path d="M487 344L588 344Q596 344 596 336L596 272Q596 264 588 264L586 264" fill="none" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>
<path d="M487 254L588 254Q596 254 596 246L596 194Q596 186 588 186L586 186" fill="none" stroke="#888780" stroke-width="1.1" marker-end="url(#ar)"/>

<!-- 交叉注意力的 K/V 箭头：H → Cross Attention，只此一条 -->
<path d="M248 107L336 107Q344 107 344 115L344 325Q344 333 352 333L388 333" fill="none" stroke="#534AB7" stroke-width="1.4" marker-end="url(#ap)"/>
<text x="340" y="200" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">K, V</text>
<text x="340" y="216" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">只此一条</text>
<text x="340" y="230" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">N 层共用</text>

<!-- 底部说明 -->
<text x="24" y="578" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">形状只变两次：① 的 11 个整数 → ② 的 11 × d，⑨ 的 11 × d → 11 × V；③④⑥⑦⑧ 全是 11 × d 进、11 × d 出。</text>
<text x="24" y="594" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">圆角框 = 重复 N 次的块：Linear 与 Softmax 在块外（没有残差弧），H 是块链的最终输出；块内每个子层都带一条从右侧绕行的残差弧。</text>
<text x="24" y="610" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">③ 与解码器的 PE 从侧面以 ⊕ 加进主干——改数值、不改形状，不在块内、不在残差里。</text>
</svg>
