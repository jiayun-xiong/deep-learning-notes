<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img">
<title>三种可见性：因果、交叉、padding</title>
<desc>左：因果 mask 的下三角可见区；中：交叉注意力的长方形全可见；右：padding 列整列屏蔽。</desc>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">三种可见性：同一行 softmax，三种 mask</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">行 = 谁在问（query），列 = 谁能被看见（key）；灰格在 softmax 之前被置为负无穷</text>

<!-- 面板 A：因果 -->
<text x="40" y="76" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">因果 mask（解码器自注意力）</text>
<g font-family="PingFang SC, sans-serif">
<!-- 行列标签 -->
<text x="88" y="96" text-anchor="middle" font-size="9" fill="#5F5E5A">j = 0 … 10（key）</text>
<text x="30" y="150" text-anchor="middle" font-size="9" fill="#5F5E5A" transform="rotate(-90 30 150)">i = 0 … 10（query）</text>
</g>
<g stroke="#B9B7AE" stroke-width="0.4">
<rect x="40" y="104" width="137.5" height="137.5" fill="#FAFAF7"/>
<rect x="40" y="104" width="137.5" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="40" y="116.5" width="137.5" height="12.5" fill="#E8E6DF"/>
<rect x="40" y="116.5" width="25" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="40" y="129" width="137.5" height="12.5" fill="#E8E6DF"/>
<rect x="40" y="129" width="37.5" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="40" y="141.5" width="137.5" height="12.5" fill="#E8E6DF"/>
<rect x="40" y="141.5" width="50" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="40" y="154" width="137.5" height="12.5" fill="#E8E6DF"/>
<rect x="40" y="154" width="62.5" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="40" y="166.5" width="137.5" height="12.5" fill="#E8E6DF"/>
<rect x="40" y="166.5" width="75" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="40" y="179" width="137.5" height="12.5" fill="#E8E6DF"/>
<rect x="40" y="179" width="87.5" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="40" y="191.5" width="137.5" height="12.5" fill="#E8E6DF"/>
<rect x="40" y="191.5" width="100" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="40" y="204" width="137.5" height="12.5" fill="#E8E6DF"/>
<rect x="40" y="204" width="112.5" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="40" y="216.5" width="137.5" height="12.5" fill="#E8E6DF"/>
<rect x="40" y="216.5" width="125" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="40" y="229" width="137.5" height="12.5" fill="#E8E6DF"/>
<rect x="40" y="229" width="137.5" height="12.5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
</g>
<text x="108" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">可见 66 格，屏蔽 55 格（L = 11）</text>
<text x="108" y="274" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">第 0 行只看得见自己</text>

<!-- 面板 B：交叉 -->
<text x="248" y="76" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">交叉注意力：m × n 长方形</text>
<text x="248" y="96" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">行 0 … 5（已生成 6 词）　列 0 … 10（源句）</text>
<rect x="248" y="104" width="121" height="78" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<g stroke="#1D9E75" stroke-width="0.3" opacity="0.55">
<line x1="259" y1="104" x2="259" y2="182"/><line x1="270" y1="104" x2="270" y2="182"/>
<line x1="281" y1="104" x2="281" y2="182"/><line x1="292" y1="104" x2="292" y2="182"/>
<line x1="303" y1="104" x2="303" y2="182"/><line x1="314" y1="104" x2="314" y2="182"/>
<line x1="325" y1="104" x2="325" y2="182"/><line x1="336" y1="104" x2="336" y2="182"/>
<line x1="347" y1="104" x2="347" y2="182"/><line x1="358" y1="104" x2="358" y2="182"/>
<line x1="248" y1="117" x2="369" y2="117"/><line x1="248" y1="130" x2="369" y2="130"/>
<line x1="248" y1="143" x2="369" y2="143"/><line x1="248" y1="156" x2="369" y2="156"/>
<line x1="248" y1="169" x2="369" y2="169"/>
</g>
<text x="308" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">无 mask：源句完整已知</text>
<text x="308" y="274" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">6 × 11：行与列来自两条不同的序列</text>

<!-- 面板 C：padding -->
<text x="452" y="76" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">padding mask：挡列不挡行</text>
<text x="452" y="96" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">同一 batch 里短句补出的位置整列屏蔽</text>
<rect x="452" y="104" width="88" height="78" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="540" y="104" width="33" height="78" fill="#E8E6DF" stroke="#888780" stroke-width="0.6"/>
<g stroke="#1D9E75" stroke-width="0.3" opacity="0.55">
<line x1="463" y1="104" x2="463" y2="182"/><line x1="474" y1="104" x2="474" y2="182"/>
<line x1="485" y1="104" x2="485" y2="182"/><line x1="496" y1="104" x2="496" y2="182"/>
<line x1="507" y1="104" x2="507" y2="182"/><line x1="518" y1="104" x2="518" y2="182"/>
<line x1="529" y1="104" x2="529" y2="182"/>
</g>
<g stroke="#888780" stroke-width="0.3" opacity="0.7">
<line x1="551" y1="104" x2="551" y2="182"/><line x1="562" y1="104" x2="562" y2="182"/>
</g>
<text x="558" y="150" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">pad</text>
<text x="508" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">所有行都看不见 pad 列</text>
<text x="508" y="274" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">与因果 mask 取"或"后统一置负无穷</text>

<text x="24" y="316" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">判据只有一条：这个位置上有没有不能提前知道的信息。有 → 挡；没有 → 不挡。</text>
<text x="24" y="334" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">挡住 = 置负无穷使 e 的负无穷次方为 0，从而不进 softmax 的分母；不是把权重压低。</text>
</svg>
