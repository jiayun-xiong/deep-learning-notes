<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" role="img">
<title>MoE：把一本大册子拆成专家池，每个 token 只查 top-k</title>
<desc>左侧四个 token 经路由器分配到四个专家，其中两个被激活加粗，未激活的专家以虚线表示；右侧给出总参数与激活参数的差别。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">MoE：把一本大册子拆成专家池，每个 token 只查 top-k</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">路由器给每个 token 打分，只有分数最高的 k 个专家参与计算</text>
<rect x="44" y="96" width="56" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="72" y="117" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#0C447C">科</text>
<rect x="44" y="146" width="56" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="72" y="167" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#0C447C">软</text>
<rect x="44" y="196" width="56" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="72" y="217" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#0C447C">实习</text>
<rect x="44" y="246" width="56" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="72" y="267" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#0C447C">报考</text>
<line x1="104" y1="112" x2="140" y2="186" stroke="#185FA5" stroke-width="1.0" marker-end="url(#ar)"/>
<line x1="104" y1="162" x2="140" y2="186" stroke="#185FA5" stroke-width="1.0" marker-end="url(#ar)"/>
<line x1="104" y1="212" x2="140" y2="186" stroke="#185FA5" stroke-width="1.0" marker-end="url(#ar)"/>
<line x1="104" y1="262" x2="140" y2="186" stroke="#185FA5" stroke-width="1.0" marker-end="url(#ar)"/>
<rect x="144" y="104" width="86" height="164" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="187" y="178" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#3C3489" font-weight="500">Router</text>
<frag x="187" y="200" size="10" color="#3C3489" anchor="middle" tex="softmax(xW_g)"/>
<text x="187" y="286" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">每个 token 单独打分</text>
<rect x="300" y="84" width="150" height="36" rx="7" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="375" y="107" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#04342C">Expert 1</text>
<rect x="300" y="132" width="150" height="36" rx="7" fill="#F4F2EC" stroke="#C9C7BE" stroke-width="0.5"/>
<text x="375" y="155" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#8A887F">Expert 2</text>
<rect x="300" y="180" width="150" height="36" rx="7" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="375" y="203" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#04342C">Expert 3</text>
<rect x="300" y="228" width="150" height="36" rx="7" fill="#F4F2EC" stroke="#C9C7BE" stroke-width="0.5"/>
<text x="375" y="251" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#8A887F">Expert 4</text>
<line x1="234" y1="186" x2="296" y2="102" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="234" y1="186" x2="296" y2="150" stroke="#C9C7BE" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#ar)"/>
<line x1="234" y1="186" x2="296" y2="198" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="234" y1="186" x2="296" y2="246" stroke="#C9C7BE" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#ar)"/>
<text x="375" y="78" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">top-2 激活，其余不参与计算</text>
<line x1="450" y1="102" x2="500" y2="102" stroke="#1D9E75" stroke-width="1.2"/>
<line x1="450" y1="198" x2="500" y2="198" stroke="#1D9E75" stroke-width="1.2"/>
<line x1="500" y1="102" x2="500" y2="198" stroke="#1D9E75" stroke-width="1.2"/>
<line x1="500" y1="174" x2="528" y2="174" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="532" y="152" width="96" height="44" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="580" y="179" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#0C447C">输出</text>
<rect x="44" y="292" width="584" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="60" y="314" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">总参数：全部专家都要驻留显存</text>
<text x="60" y="334" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">激活参数：每个 token 只算 top-k 个专家</text>
<text x="624" y="324" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#04342C">Mixtral 8×7B：47B / 13B</text>
</svg>
