<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img">
<title>FFN 是一本 key-value memory</title>
<desc>FFN 的第一层每个神经元是一个 key（模式检测器），第二层每一列是 value（写回方向），输出是激活加权的 value 之和。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">FFN 是一本 key-value memory</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">左：输入与每个 key 点积得到激活；右：激活当权重，把对应 value 加权写回</text>
<rect x="44" y="92" width="34" height="144" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="61" y="84" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#0C447C">x</text>
<text x="61" y="250" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">1×d</text>
<text x="112" y="84" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">W1 的每一列 = 一个 key</text>
<rect x="112" y="92" width="112" height="144" rx="3" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<line x1="112" y1="92" x2="224" y2="92" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="120" y="108" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">k1</text>
<line x1="112" y1="116" x2="224" y2="116" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="120" y="132" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">k2</text>
<line x1="112" y1="140" x2="224" y2="140" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="120" y="156" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">k3</text>
<line x1="112" y1="164" x2="224" y2="164" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="120" y="180" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">k4</text>
<line x1="112" y1="188" x2="224" y2="188" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="120" y="204" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">k5</text>
<line x1="112" y1="212" x2="224" y2="212" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="120" y="228" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">k6</text>
<line x1="82" y1="164.0" x2="108" y2="164.0" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="95" y="156.0" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">·</text>
<text x="272" y="84" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">激活 a_j = max(0, x·k_j)</text>
<rect x="272" y="92" width="150" height="144" rx="3" fill="#FFFFFF" stroke="#888780" stroke-width="0.5" opacity="0"/>
<rect x="272" y="97" width="118.4" height="14" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="272" y="121" width="27.2" height="14" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="272" y="145" width="92.0" height="14" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="272" y="169" width="8.0" height="14" rx="2" fill="#EDEBE4" stroke="#C9C7BE" stroke-width="0.4"/>
<text x="276" y="181" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">0</text>
<rect x="272" y="193" width="60.8" height="14" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<rect x="272" y="217" width="36.8" height="14" rx="2" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.4"/>
<line x1="224" y1="164.0" x2="268" y2="164.0" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<frag x="246" y="154.0" size="11" color="#5F5E5A" anchor="middle" tex="\cdot"/>
<text x="448" y="84" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">W2 的每一列 = 一个 value</text>
<rect x="448" y="92" width="112" height="144" rx="3" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<line x1="448" y1="92" x2="560" y2="92" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="456" y="108" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">v1</text>
<line x1="448" y1="116" x2="560" y2="116" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="456" y="132" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">v2</text>
<line x1="448" y1="140" x2="560" y2="140" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="456" y="156" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">v3</text>
<line x1="448" y1="164" x2="560" y2="164" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="456" y="180" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">v4</text>
<line x1="448" y1="188" x2="560" y2="188" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="456" y="204" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">v5</text>
<line x1="448" y1="212" x2="560" y2="212" stroke="#E5E3DC" stroke-width="0.5"/>
<text x="456" y="228" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">v6</text>
<line x1="392" y1="164.0" x2="444" y2="164.0" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<frag x="418" y="154.0" size="11" color="#5F5E5A" anchor="middle" tex="\times"/>
<rect x="592" y="92" width="34" height="144" rx="3" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="609" y="84" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#04342C">Δx</text>
<text x="609" y="250" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">1×d</text>
<line x1="562" y1="164.0" x2="588" y2="164.0" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="575" y="156.0" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">Σ</text>
<text x="44" y="280" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">激活为 0 的那一行不写回——册子里没被匹配到的条目，对输出毫无贡献</text>
</svg>
