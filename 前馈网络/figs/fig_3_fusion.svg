<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424" role="img">
<title>融合发生在注意力，门控发生在相乘那一步</title>
<desc>注意力把其他位置的特征按权重搬进当前位置，FFN 的两个投影从同一个融合向量里读出内容与闸门并相乘。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">融合发生在注意力，门控发生在相乘那一步</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">FFN 读到的 x 不是裸词向量，而是“本位置 + 别的位置搬来的”混合体</text>
<rect x="34" y="66" width="88" height="32" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<text x="78" y="87" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#04342C">科</text>
<rect x="134" y="66" width="88" height="32" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/>
<text x="178" y="87" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">软</text>
<rect x="234" y="66" width="88" height="32" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/>
<text x="278" y="87" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">放</text>
<rect x="334" y="66" width="88" height="32" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/>
<text x="378" y="87" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#2C2C2A">实习</text>
<rect x="434" y="66" width="88" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="478" y="87" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#3C3489">吸引</text>
<rect x="534" y="66" width="88" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="578" y="87" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#3C3489">学生</text>
<line x1="78" y1="98" x2="78" y2="116" stroke="#1D9E75" stroke-width="1.1"/>
<line x1="178" y1="98" x2="178" y2="116" stroke="#888780" stroke-width="1.1"/>
<line x1="278" y1="98" x2="278" y2="116" stroke="#888780" stroke-width="1.1"/>
<line x1="378" y1="98" x2="378" y2="116" stroke="#888780" stroke-width="1.1"/>
<line x1="478" y1="98" x2="478" y2="116" stroke="#534AB7" stroke-width="1.1"/>
<line x1="578" y1="98" x2="578" y2="116" stroke="#534AB7" stroke-width="1.1"/>
<rect x="34" y="118" width="588" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="328" y="137" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0C447C">Attention 加权求和：按权重把其他位置的表示搬进这个位置（科）</text>
<line x1="328" y1="146" x2="328" y2="164" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="228" y="166" width="200" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="328.0" y="190.0" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" fill="#2C2C2A">x（融合向量）</text>
<text x="436" y="184" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">已混入 吸引 / 学生</text>
<text x="436" y="198" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">带来的语境特征</text>
<line x1="300" y1="206" x2="186" y2="238" stroke="#534AB7" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="356" y1="206" x2="480" y2="238" stroke="#534AB7" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="60" y="240" width="240" height="42" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="180" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#3C3489">x·W1：读“缩略语”</text>
<text x="180" y="274" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">内容强度 2.0（科 自己给的）</text>
<rect x="376" y="240" width="244" height="42" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="498" y="258" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#3C3489">x·W2：读“机构语境”</text>
<text x="498" y="274" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">闸门开度 0.05 / 0.88（别处给的）</text>
<line x1="180" y1="282" x2="310" y2="306" stroke="#534AB7" stroke-width="1.2"/>
<line x1="498" y1="282" x2="346" y2="306" stroke="#534AB7" stroke-width="1.2"/>
<circle cx="328" cy="318" r="20" fill="#FFFFFF" stroke="#888780" stroke-width="0.6"/>
<svg x="322.3" y="314.4" width="11.4" height="9.8" viewBox="0 0 880 754"><g fill="currentColor" stroke-width="0" transform="translate(0 659.5) scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2297" d="M56 250Q56 394 156 488T384 583Q530 583 626 485T722 250Q722 110 625 14T390 -83Q249 -83 153 14T56 250ZM582 471Q531 510 496 523Q446 542 381 542Q324 542 272 519T196 471L389 278L485 375L582 471ZM167 442Q95 362 95 250Q95 137 167 58L359 250L167 442ZM610 58Q682 138 682 250Q682 363 610 442L418 250L610 58ZM196 29Q209 16 230 2T295 -27T388 -42Q409 -42 429 -40T465 -33T496 -23T522 -11T544 1T561 13T574 22T582 29L388 222L196 29Z"></path></g></g></g></svg>
<line x1="328" y1="338" x2="328" y2="352" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="228" y="354" width="200" height="36" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="328.0" y="376.0" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#04342C">第 j 维：2.0 × 闸门</text>
<text x="24" y="410" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">跨越发生在注意力那一步；FFN 内部只是把同一个融合向量读了两次</text>
</svg>
