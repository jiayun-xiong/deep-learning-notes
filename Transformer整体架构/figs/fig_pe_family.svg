<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 354" width="680" height="354" role="img">
<title>位置编码的四种做法</title>
<desc>正弦式用不同频率的三角函数硬编码绝对位置；可学习式给每个位置一个可训练向量；相对偏置在注意力分数上按距离加减；RoPE 把 Q 和 K 按位置旋转，使内积只依赖相对距离。</desc>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">位置编码的四种做法</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">从「硬算一个绝对位置」到「只让内积看见相对距离」，这条线就是现代 LLM 的演化方向</text>

<rect x="24" y="70" width="306" height="124" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="40" y="96" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#0C447C">① 正弦式 Sinusoidal</text>
<text x="40" y="122" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#185FA5">不同频率的 sin/cos，直接加到嵌入上</text>
<text x="40" y="148" font-family="Menlo, monospace" font-size="10" fill="#0C447C">PE(pos,2i) = sin(pos / 10000^(2i/d))</text>
<text x="40" y="176" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">代表：原论文（2017）</text>

<rect x="350" y="70" width="306" height="124" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="366" y="96" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#0C447C">② 可学习 Learned</text>
<text x="366" y="122" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#185FA5">每个位置一个可训练向量，长度写死</text>
<text x="366" y="148" font-family="Menlo, monospace" font-size="10" fill="#0C447C">E_pos ∈ R^(L_max × d)</text>
<text x="366" y="176" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">代表：BERT、GPT-2</text>

<rect x="24" y="210" width="306" height="124" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="40" y="236" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#3C3489">③ 相对位置偏置</text>
<text x="40" y="262" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#534AB7">不编绝对位置，给注意力分数加距离偏置</text>
<text x="40" y="288" font-family="Menlo, monospace" font-size="10" fill="#3C3489">s_ij  +=  b_(i − j)</text>
<text x="40" y="316" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">代表：T5、DeBERTa</text>

<rect x="350" y="210" width="306" height="124" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="366" y="236" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#04342C">④ RoPE 旋转位置编码</text>
<text x="366" y="262" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0F6E56">按位置旋转 Q/K，内积只依赖相对距离</text>
<text x="366" y="288" font-family="Menlo, monospace" font-size="10" fill="#04342C">⟨R_m q , R_n k⟩ = ⟨q , R_(n−m) k⟩</text>
<text x="366" y="316" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">代表：LLaMA、Qwen（现代主流）</text>
</svg>
