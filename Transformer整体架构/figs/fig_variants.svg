<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img">
<title>三种架构变体：编码器-only、解码器-only、编码器加解码器</title>
<desc>编码器-only 只有双向自注意力，适合分类与检索；解码器-only 只有因果掩码自注意力，适合对话与续写；编码器加解码器多了一层交叉注意力，适合翻译、摘要这类序列到序列任务。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">三种变体：区别只在「看不看后面」和「有没有第二条序列」</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">原论文是最右边那一支，今天的 LLM 大多落在中间那一支</text>

<rect x="24" y="72" width="200" height="190" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="124" y="96" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">编码器-only</text>
<text x="124" y="114" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">BERT</text>
<rect x="76" y="126" width="96" height="64" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="124" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">编码器</text>
<text x="124" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#185FA5">双向自注意力</text>
<line x1="124" y1="190" x2="124" y2="200" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="48" y="202" width="152" height="38" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="124" y="225" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">分类 / 检索头</text>

<rect x="240" y="72" width="200" height="190" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="96" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">解码器-only</text>
<text x="340" y="114" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">GPT · LLaMA · Qwen</text>
<rect x="292" y="126" width="96" height="64" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">解码器</text>
<text x="340" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#534AB7">因果掩码自注意力</text>
<line x1="340" y1="190" x2="340" y2="200" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="264" y="202" width="152" height="38" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="225" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#3C3489">逐词生成</text>

<rect x="456" y="72" width="200" height="190" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="556" y="96" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">编码器 + 解码器</text>
<text x="556" y="114" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">原论文 · T5 · BART</text>
<rect x="472" y="126" width="68" height="64" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="506" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#0C447C">编码器</text>
<text x="506" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#185FA5">双向</text>
<rect x="568" y="126" width="68" height="64" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="602" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#3C3489">解码器</text>
<text x="602" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#534AB7">因果</text>
<line x1="542" y1="158" x2="564" y2="158" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="602" y1="190" x2="602" y2="200" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="472" y="202" width="168" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="556" y="225" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#412402">交叉注意力搭桥</text>

<text x="24" y="282" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">适合：分类、检索、句子向量</text>
<text x="240" y="282" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">适合：对话、续写、代码</text>
<text x="456" y="282" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">适合：翻译、摘要、语音识别</text>
</svg>
