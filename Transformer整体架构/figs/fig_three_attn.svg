<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img">
<title>三种注意力的 Q、K、V 来源与矩阵形状</title>
<desc>编码器自注意力的 Q、K、V 全部来自编码器，可见全部位置，矩阵为 n 乘 n；解码器掩码自注意力三者全部来自解码器，可见 j 小于等于 i，矩阵为 n 乘 n；交叉注意力的 Q 来自解码器、K 和 V 来自编码器，可见源句全部位置，矩阵为 m 乘 n。</desc>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">三种注意力：公式一模一样，只差 Q/K/V 从哪来</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">把这三栏记住，整个编码器—解码器结构就没有模糊地带了</text>

<rect x="24" y="72" width="200" height="224" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="124" y="96" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">① 编码器自注意力</text>
<rect x="36" y="110" width="176" height="34" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="124" y="131" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#0C447C">Q ← 编码器</text>
<rect x="36" y="152" width="176" height="34" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="124" y="173" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#0C447C">K ← 编码器</text>
<rect x="36" y="194" width="176" height="34" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="124" y="215" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#0C447C">V ← 编码器</text>
<text x="124" y="252" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">可见：全部 n 个位置</text>
<text x="124" y="274" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#185FA5">矩阵 n × n</text>

<rect x="240" y="72" width="200" height="224" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="96" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">② 解码器掩码自注意力</text>
<rect x="252" y="110" width="176" height="34" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="131" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#3C3489">Q ← 解码器</text>
<rect x="252" y="152" width="176" height="34" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="173" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#3C3489">K ← 解码器</text>
<rect x="252" y="194" width="176" height="34" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="215" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#3C3489">V ← 解码器</text>
<text x="340" y="252" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">可见：只到 j ≤ i</text>
<text x="340" y="274" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#534AB7">矩阵 n × n</text>

<rect x="456" y="72" width="200" height="224" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="556" y="96" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">③ 交叉注意力</text>
<rect x="468" y="110" width="176" height="34" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="556" y="131" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#3C3489">Q ← 解码器</text>
<rect x="468" y="152" width="176" height="34" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="556" y="173" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#0C447C">K ← 编码器</text>
<rect x="468" y="194" width="176" height="34" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="556" y="215" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#0C447C">V ← 编码器</text>
<text x="556" y="252" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">可见：源句全部 n 个</text>
<text x="556" y="274" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#993C1D">矩阵 m × n</text>

<text x="24" y="320" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">注：三块各有独立的 Wq / Wk / Wv / Wo，解码器 6 层里每层都有一套自己的，不共享</text>
</svg>
