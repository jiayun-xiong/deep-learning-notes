<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="680" height="452" role="img">
<title>一个编码器块的两种归一化位置：pre-LN 与 post-LN</title>
<desc>pre-LN 把 LayerNorm 放在残差分支内部，残差主线始终是纯加法；post-LN 在每次相加之后再做归一化，残差主线的每一步都被重新缩放。现代模型普遍采用 pre-LN。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">一个编码器块：差别只在 LN 站哪</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">同一个块，同一个公式，只挪了一次 LayerNorm 的位置，后果是天壤之别</text>

<rect x="24" y="56" width="306" height="342" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="174" y="78" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#0C447C">pre-LN（现代主流）</text>

<line x1="174" y1="90" x2="174" y2="94" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="94" y="96" width="160" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="174" y="117" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">LayerNorm</text>
<line x1="174" y1="128" x2="174" y2="138" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="94" y="140" width="160" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="174" y="163" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">多头自注意力</text>
<line x1="174" y1="176" x2="174" y2="179" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<circle cx="174" cy="190" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<line x1="168" y1="190" x2="180" y2="190" stroke="#888780" stroke-width="1"/>
<line x1="174" y1="184" x2="174" y2="196" stroke="#888780" stroke-width="1"/>
<line x1="174" y1="199" x2="174" y2="208" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="94" y="210" width="160" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="174" y="231" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">LayerNorm</text>
<line x1="174" y1="242" x2="174" y2="252" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="94" y="254" width="160" height="36" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="174" y="277" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">前馈网络</text>
<line x1="174" y1="290" x2="174" y2="293" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<circle cx="174" cy="304" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<line x1="168" y1="304" x2="180" y2="304" stroke="#888780" stroke-width="1"/>
<line x1="174" y1="298" x2="174" y2="310" stroke="#888780" stroke-width="1"/>
<line x1="174" y1="313" x2="174" y2="326" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>

<path d="M174 86 L58 86 L58 190 L163 190" fill="none" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#ar1)"/>
<path d="M174 204 L72 204 L72 304 L163 304" fill="none" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#ar1)"/>

<text x="174" y="362" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#0C447C">x + MHA(LN(x))</text>
<text x="174" y="382" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0F6E56">残差主线（绿）不过 LN，是纯加法总线</text>

<rect x="350" y="56" width="306" height="342" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="506" y="78" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#3C3489">post-LN（原论文）</text>

<line x1="506" y1="90" x2="506" y2="94" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="426" y="96" width="160" height="36" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="506" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">多头自注意力</text>
<line x1="506" y1="132" x2="506" y2="138" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<circle cx="506" cy="148" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<line x1="500" y1="148" x2="512" y2="148" stroke="#888780" stroke-width="1"/>
<line x1="506" y1="142" x2="506" y2="154" stroke="#888780" stroke-width="1"/>
<line x1="506" y1="157" x2="506" y2="166" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="426" y="168" width="160" height="32" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="506" y="189" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#3C3489">LayerNorm</text>
<line x1="506" y1="200" x2="506" y2="210" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="426" y="212" width="160" height="36" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="506" y="235" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">前馈网络</text>
<line x1="506" y1="248" x2="506" y2="253" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<circle cx="506" cy="264" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<line x1="500" y1="264" x2="512" y2="264" stroke="#888780" stroke-width="1"/>
<line x1="506" y1="258" x2="506" y2="270" stroke="#888780" stroke-width="1"/>
<line x1="506" y1="273" x2="506" y2="282" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="426" y="284" width="160" height="32" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="506" y="305" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#3C3489">LayerNorm</text>
<line x1="506" y1="316" x2="506" y2="326" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>

<path d="M506 88 L390 88 L390 148 L497 148" fill="none" stroke="#BA7517" stroke-width="1.2" marker-end="url(#ar1)"/>
<path d="M506 205 L404 205 L404 264 L497 264" fill="none" stroke="#BA7517" stroke-width="1.2" marker-end="url(#ar1)"/>

<text x="506" y="362" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#3C3489">LN(x + MHA(x))</text>
<text x="506" y="382" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#854F0B">每加一次就归一化一次，主线被反复缩放</text>

<text x="24" y="414" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">为什么后果这么大：pre-LN 的残差主线是恒等路径，梯度可以直穿到底，所以能堆上百层；</text>
<text x="24" y="432" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">post-LN 每层都要过一次 LN 的雅可比，深了只能靠 warmup 硬扛（原论文 4000 步）</text>
</svg>
