<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img">
<title>自注意力是方阵，交叉注意力是长方形</title>
<desc>自注意力的分数矩阵是 n 乘 n 的方阵，下三角可见、上三角被掩码；交叉注意力的分数矩阵是 m 乘 n 的长方形，行是译文的 m 个位置、列是源句的 n 个位置，没有掩码。</desc>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">自注意力是方阵，交叉注意力是长方形</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">同一个 softmax，只换了 K/V 的来源，矩阵形状就变了 —— 这个形状在 decoder-only 里永远见不到</text>

<text x="24" y="80" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#0C447C">① 自注意力：方阵 n × n</text>
<text x="340" y="80" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#3C3489">② 交叉注意力：长方形 m × n</text>

<rect x="96" y="104" width="163.5" height="163.5" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<path d="M96 104 L96 267.5 L259.5 267.5 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>

<text x="109" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">1</text>
<text x="136.5" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">2</text>
<text x="164" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">3</text>
<text x="191.5" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">4</text>
<text x="219" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">5</text>
<text x="246.5" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">6</text>

<text x="88" y="121" text-anchor="end" font-family="Menlo, monospace" font-size="10" fill="#888780">1</text>
<text x="88" y="148.5" text-anchor="end" font-family="Menlo, monospace" font-size="10" fill="#888780">2</text>
<text x="88" y="176" text-anchor="end" font-family="Menlo, monospace" font-size="10" fill="#888780">3</text>
<text x="88" y="203.5" text-anchor="end" font-family="Menlo, monospace" font-size="10" fill="#888780">4</text>
<text x="88" y="231" text-anchor="end" font-family="Menlo, monospace" font-size="10" fill="#888780">5</text>
<text x="88" y="258.5" text-anchor="end" font-family="Menlo, monospace" font-size="10" fill="#888780">6</text>

<rect x="452" y="104" width="163.5" height="108.5" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>

<text x="465" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">1</text>
<text x="492.5" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">2</text>
<text x="520" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">3</text>
<text x="547.5" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">4</text>
<text x="575" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">5</text>
<text x="602.5" y="98" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">6</text>

<text x="444" y="121" text-anchor="end" font-family="Menlo, monospace" font-size="10" fill="#888780">1</text>
<text x="444" y="148.5" text-anchor="end" font-family="Menlo, monospace" font-size="10" fill="#888780">2</text>
<text x="444" y="176" text-anchor="end" font-family="Menlo, monospace" font-size="10" fill="#888780">3</text>
<text x="444" y="203.5" text-anchor="end" font-family="Menlo, monospace" font-size="10" fill="#888780">4</text>

<text x="452" y="240" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">行 = 译文的第 1..m 个词（Q 来自这里）</text>
<text x="452" y="258" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">列 = 源句的第 1..n 个词（K/V 来自这里）</text>
<text x="452" y="278" font-family="PingFang SC, sans-serif" font-size="11" fill="#185FA5">没有掩码：源句是完整已知的，不用挡</text>

<text x="24" y="292" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">行和列是同一条序列，所以必然是方阵</text>
<text x="24" y="310" font-family="PingFang SC, sans-serif" font-size="11" fill="#185FA5">上三角（灰）被掩码打成 −∞，只剩 j ≤ i</text>

<line x1="24" y1="326" x2="656" y2="326" stroke="#D3D1C7" stroke-width="1"/>
<text x="24" y="346" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">注：m ≠ n 是常态。解码器生成了 4 个词、源句 6 个词，就是 4 × 6 的长方形 —— 每个译词对源句做一次长度为 n 的加权平均</text>
</svg>
