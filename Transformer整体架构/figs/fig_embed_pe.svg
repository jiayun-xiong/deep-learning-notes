<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 338" width="680" height="338" role="img">
<title>嵌入是查表，位置编码是逐元素相加</title>
<desc>左边示意嵌入矩阵按 id 取出一行得到 d 维向量；右边示意嵌入向量与位置编码向量逐元素相加后维度不变，而拼接会让维度变成 2d 导致残差接不上。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">嵌入是查表，位置编码是「加」</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">这两件事初学者最容易糊在一起：一个是按 id 取行，一个是逐元素相加</text>

<rect x="24" y="64" width="296" height="254" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="40" y="88" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">① 嵌入：查表，不是乘矩阵</text>

<text x="190" y="112" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">E：37000 行 × 512 列</text>
<rect x="130" y="120" width="120" height="160" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<line x1="130" y1="140" x2="250" y2="140" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="130" y1="160" x2="250" y2="160" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="130" y1="200" x2="250" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="130" y1="220" x2="250" y2="220" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="130" y1="240" x2="250" y2="240" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="130" y1="260" x2="250" y2="260" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="130" y="180" width="120" height="20" fill="#B5D4F4"/>

<rect x="30" y="175" width="62" height="30" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="61" y="194" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#2C2C2A">id 1024</text>
<line x1="94" y1="190" x2="126" y2="190" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="252" y1="190" x2="282" y2="190" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>

<text x="30" y="292" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">查表 = one-hot 乘矩阵，等价于取第 i 行</text>
<text x="30" y="312" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">只有被取到的那一行才有梯度（稀疏更新）</text>

<rect x="344" y="64" width="312" height="254" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="360" y="88" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">② 位置编码：加在嵌入上</text>

<text x="360" y="121" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">嵌入 e</text>
<rect x="440" y="110" width="18" height="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="460" y="110" width="18" height="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="480" y="110" width="18" height="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="500" y="110" width="18" height="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="520" y="110" width="18" height="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="540" y="110" width="18" height="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>

<text x="360" y="157" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">+ PE</text>
<rect x="440" y="146" width="18" height="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="460" y="146" width="18" height="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="480" y="146" width="18" height="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="500" y="146" width="18" height="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="520" y="146" width="18" height="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="540" y="146" width="18" height="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>

<text x="360" y="193" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">= 输入</text>
<rect x="440" y="182" width="18" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="460" y="182" width="18" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="480" y="182" width="18" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="500" y="182" width="18" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="520" y="182" width="18" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="540" y="182" width="18" height="18" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="566" y="195" font-family="Menlo, monospace" font-size="10" fill="#185FA5">d 维不变</text>

<text x="360" y="246" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">如果改成拼接 (e ; PE)：</text>
<text x="360" y="268" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">维度变 2d，第一层的 Wq/Wk/Wv 都得改宽</text>
<text x="360" y="290" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#A32D2D">残差 x + Sublayer(x) 直接对不上 → 加不上</text>
<text x="360" y="310" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#185FA5">所以位置信息只能「加」，不能「拼」</text>
</svg>
