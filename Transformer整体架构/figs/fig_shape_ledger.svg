<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" width="680" height="232" role="img">
<title>一条数据从 token 到概率的形状变化</title>
<desc>输入 id 是长度 6 的向量，词嵌入加位置编码后变成 6 乘 512，编码器保持 6 乘 512 不变；解码器这一路是 4 乘 512，最后线性层与 softmax 把 512 投到 37000 的词表维度。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">形状账：从 token 走到概率</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">以 base 模型为例：源句 n = 6、译文 m = 4、d_model = 512、词表 37000</text>

<rect x="24" y="76" width="104" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="76" y="103" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">输入 id</text>
<text x="76" y="123" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#5F5E5A">6</text>

<rect x="152" y="76" width="104" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="204" y="103" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#0C447C">词嵌入 + PE</text>
<text x="204" y="123" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#185FA5">6 × 512</text>

<rect x="280" y="76" width="104" height="64" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="332" y="103" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#0C447C">编码器 × 6</text>
<text x="332" y="123" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#0C447C">6 × 512</text>

<rect x="408" y="76" width="104" height="64" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="460" y="103" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#3C3489">解码器 × 6</text>
<text x="460" y="123" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#3C3489">4 × 512</text>

<rect x="536" y="76" width="104" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="588" y="103" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#04342C">线性 + softmax</text>
<text x="588" y="123" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#0F6E56">4 × 37000</text>

<line x1="130" y1="108" x2="146" y2="108" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="258" y1="108" x2="274" y2="108" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="386" y1="108" x2="402" y2="108" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="514" y1="108" x2="530" y2="108" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>

<line x1="24" y1="164" x2="656" y2="164" stroke="#D3D1C7" stroke-width="1"/>

<rect x="24" y="180" width="10" height="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="42" y="189" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">宽度 512 从头到尾没变过 —— 同形才能一路加残差，这是能叠 6 层（乃至 96 层）的前提</text>

<rect x="24" y="202" width="10" height="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="42" y="211" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">长度会变：编码器那一路 n 固定，解码器的 m 随着生成逐步变长；交叉注意力是唯一同时看到 m 和 n 的地方</text>
</svg>
