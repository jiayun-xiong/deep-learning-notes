<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img">
<title>训练与推理时解码器输入的不同</title>
<desc>训练时解码器一次吃进整条右移一位的序列，四个位置同时被监督；推理时每步只多送一个词，前 t 减 1 个词的 K 和 V 保持不变，可以缓存。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">训练一次算完，推理一个词一个词来</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">同一套权重、两种跑法，差别全在解码器的输入怎么喂</text>

<rect x="24" y="72" width="306" height="228" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="38" y="96" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">训练：一条序列喂满，并行监督</text>
<text x="38" y="124" font-family="PingFang SC, sans-serif" font-size="11" fill="#888780">解码器输入（整体右移一位）</text>
<rect x="38" y="132" width="58" height="32" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="67" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0C447C">⟨bos⟩</text>
<rect x="104" y="132" width="58" height="32" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="133" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">科软</text>
<rect x="170" y="132" width="58" height="32" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="199" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">放实习</text>
<rect x="236" y="132" width="58" height="32" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="265" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">它</text>

<text x="38" y="190" font-family="PingFang SC, sans-serif" font-size="11" fill="#888780">要预测的目标（就是原句）</text>
<rect x="38" y="198" width="58" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="67" y="218" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">科软</text>
<rect x="104" y="198" width="58" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="133" y="218" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">放实习</text>
<rect x="170" y="198" width="58" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="199" y="218" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">它</text>
<rect x="236" y="198" width="58" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="265" y="218" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">吸引</text>
<text x="38" y="274" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">4 个位置同时出损失，梯度一次回传</text>

<rect x="350" y="72" width="306" height="228" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="364" y="96" font-family="PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#2C2C2A">推理：每步只多一个词</text>

<rect x="364" y="132" width="58" height="32" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="393" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#04342C">⟨bos⟩</text>
<line x1="426" y1="148" x2="438" y2="148" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="442" y="132" width="58" height="32" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="471" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">科软</text>

<rect x="364" y="176" width="58" height="32" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="393" y="196" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#04342C">⟨bos⟩</text>
<rect x="426" y="176" width="58" height="32" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="455" y="196" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">科软</text>
<line x1="488" y1="192" x2="500" y2="192" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="504" y="176" width="58" height="32" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="533" y="196" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">放实习</text>

<rect x="364" y="220" width="58" height="32" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="393" y="240" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#04342C">⟨bos⟩</text>
<rect x="426" y="220" width="58" height="32" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="455" y="240" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">科软</text>
<rect x="488" y="220" width="58" height="32" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="517" y="240" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">放实习</text>
<line x1="550" y1="236" x2="562" y2="236" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<rect x="566" y="220" width="58" height="32" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="595" y="240" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">它</text>

<text x="364" y="274" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">前 t−1 个词的 K/V 原封不动，缓存下来</text>

<line x1="24" y1="316" x2="656" y2="316" stroke="#D3D1C7" stroke-width="1"/>
<text x="24" y="336" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">注：训练靠「右移 + 因果掩码」一次拿到 m 个监督信号；推理靠 KV cache 避免重算前面那 t−1 个词</text>
</svg>
