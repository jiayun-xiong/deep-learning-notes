<svg viewBox="0 0 680 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>LayerNorm 与 BatchNorm 的归一化方向对比</title>
  <desc>网格表示一个 batch 的特征矩阵。LayerNorm 沿每一行（单个样本的特征维）计算统计量，BatchNorm 沿每一列（跨 batch 的同一特征）计算统计量。</desc>
  <defs>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <text x="40" y="36" font-size="14" font-weight="500" fill="#26215C" font-family="sans-serif">一个 batch 的特征矩阵 X（形状 B × d）</text>

  <line x1="40" y1="52" x2="70" y2="52" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrowT)"/>
  <text x="78" y="56" font-size="12" fill="#0F6E56" font-family="sans-serif">LayerNorm：沿每一行（每个样本自己算）</text>
  <line x1="330" y1="52" x2="360" y2="52" stroke="#D85A30" stroke-width="2" marker-end="url(#arrowC)"/>
  <text x="368" y="56" font-size="12" fill="#993C1D" font-family="sans-serif">BatchNorm：沿每一列（跨 batch 算）</text>

  <g font-size="12" fill="#5F5E5A" text-anchor="middle" font-family="sans-serif">
    <text x="162" y="80">d₁</text><text x="226" y="80">d₂</text><text x="290" y="80">d₃</text><text x="354" y="80">d₄</text><text x="418" y="80">d₅</text>
  </g>
  <g font-size="12" fill="#5F5E5A" text-anchor="end" font-family="sans-serif">
    <text x="118" y="106">样本 1</text><text x="118" y="142">样本 2</text><text x="118" y="178">样本 3</text><text x="118" y="214">样本 4</text>
  </g>

  <g>
    <rect x="130" y="88" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="194" y="88" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="258" y="88" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="322" y="88" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="386" y="88" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="130" y="124" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="194" y="124" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="258" y="124" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="322" y="124" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="386" y="124" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="130" y="160" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="194" y="160" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="258" y="160" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="322" y="160" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="386" y="160" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="130" y="196" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="194" y="196" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="258" y="196" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="322" y="196" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <rect x="386" y="196" width="58" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  </g>

  <g stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrowT)">
    <line x1="134" y1="103" x2="442" y2="103"/>
    <line x1="134" y1="139" x2="442" y2="139"/>
    <line x1="134" y1="175" x2="442" y2="175"/>
    <line x1="134" y1="211" x2="442" y2="211"/>
  </g>
  <g stroke="#D85A30" stroke-width="1.5" fill="none" marker-end="url(#arrowC)">
    <line x1="162" y1="92" x2="162" y2="222"/>
    <line x1="226" y1="92" x2="226" y2="222"/>
    <line x1="290" y1="92" x2="290" y2="222"/>
    <line x1="354" y1="92" x2="354" y2="222"/>
    <line x1="418" y1="92" x2="418" y2="222"/>
  </g>

  <text x="40" y="262" font-size="12" fill="#085041" font-family="sans-serif">LN 的 μ、σ 只看本行 → 与 batch 大小、batch 里有哪些样本完全无关</text>
  <text x="40" y="284" font-size="12" fill="#712B13" font-family="sans-serif">BN 的 μ、σ 看整列 → 换一个 batch、batch 大小一变，统计量就变</text>
  <text x="40" y="306" font-size="12" fill="#444441" font-family="sans-serif">Transformer 中每一行 = 一个 token 的 d 维表示</text>
</svg>
