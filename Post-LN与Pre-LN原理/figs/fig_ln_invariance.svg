<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 276" width="680" height="276" role="img">
<title>三种不同输入经过 LayerNorm 后得到完全相同的输出</title>
<desc>原始向量、整体乘 2、整体加 100，三种输入的 LayerNorm 输出完全一样，说明 LN 只保留形状。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="28" y="64" width="176" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="116" y="82" text-anchor="middle" dominant-baseline="central" font-family="Menlo, monospace" font-size="12" fill="#2C2C2A">[2, 4, 6, 8]</text>
<text x="116" y="98" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">原始</text>

<rect x="28" y="126" width="176" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="116" y="144" text-anchor="middle" dominant-baseline="central" font-family="Menlo, monospace" font-size="12" fill="#2C2C2A">[4, 8, 12, 16]</text>
<text x="116" y="160" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">整体乘 2，声音大一倍</text>

<rect x="28" y="188" width="176" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="116" y="206" text-anchor="middle" dominant-baseline="central" font-family="Menlo, monospace" font-size="12" fill="#2C2C2A">[102, 104, 106, 108]</text>
<text x="116" y="222" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">整体加 100，整体偏高</text>

<line x1="208" y1="87" x2="248" y2="116" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="208" y1="149" x2="248" y2="132" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="208" y1="211" x2="248" y2="148" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="252" y="84" width="104" height="96" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="304" y="124" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="16" font-weight="500" fill="#412402">LN</text>
<text x="304" y="148" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="11" fill="#854F0B">减均值 ÷ 标准差</text>

<line x1="360" y1="132" x2="424" y2="138" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="428" y="108" width="216" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="536" y="130" text-anchor="middle" dominant-baseline="central" font-family="Menlo, monospace" font-size="12" fill="#04342C">[-1.34, -0.45, 0.45, 1.34]</text>
<text x="536" y="152" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="11" fill="#0F6E56">三组输入，输出一模一样</text>

<text x="28" y="258" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">均值 0、标准差 1——不管你交上来的是 A4 还是 A3、10 号字还是 20 号字，印出来都是同一版式</text>
</svg>
