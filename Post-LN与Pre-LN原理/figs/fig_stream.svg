<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img">
<title>post-LN 每层重新排版 versus pre-LN 只叠不改</title>
<desc>左：post-LN 每层把旧内容重新排版后誊到新纸上，原始 x 被改写。右：pre-LN 在原始 x 上叠透明修改层，原始内容始终可见。</desc>

<rect x="36" y="48" width="304" height="216" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="52" y="72" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#633806">post-LN：每层誊一张新纸</text>

<rect x="120" y="88" width="140" height="34" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="190" y="105" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">第 3 层（重排版后）</text>
<rect x="130" y="130" width="140" height="34" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="200" y="147" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">第 2 层（重排版后）</text>
<rect x="140" y="172" width="140" height="34" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="210" y="189" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">第 1 层（重排版后）</text>
<line x1="150" y1="224" x2="330" y2="224" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="240" y="240" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#854F0B">原始 x 已在第一台 LN 被改写</text>
<text x="52" y="258" font-family="PingFang SC, sans-serif" font-size="11" fill="#854F0B">回传时每张纸都要重新校对</text>

<rect x="348" y="48" width="296" height="216" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="364" y="72" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#04342C">pre-LN：只往上叠透明片</text>

<rect x="420" y="88" width="150" height="30" rx="6" fill="#9FE1CB" fill-opacity="0.55" stroke="#1D9E75" stroke-width="0.5"/>
<text x="495" y="103" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#04342C">第 3 层的修改</text>
<rect x="420" y="126" width="150" height="30" rx="6" fill="#9FE1CB" fill-opacity="0.55" stroke="#1D9E75" stroke-width="0.5"/>
<text x="495" y="141" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#04342C">第 2 层的修改</text>
<rect x="420" y="164" width="150" height="30" rx="6" fill="#9FE1CB" fill-opacity="0.55" stroke="#1D9E75" stroke-width="0.5"/>
<text x="495" y="179" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#04342C">第 1 层的修改</text>
<rect x="420" y="202" width="150" height="30" rx="6" fill="#04342C"/>
<text x="495" y="217" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#E1F5EE">原始 x（始终在最底层）</text>
<text x="364" y="258" font-family="PingFang SC, sans-serif" font-size="11" fill="#0F6E56">回传时有一条直路通到原始 x</text>
</svg>
