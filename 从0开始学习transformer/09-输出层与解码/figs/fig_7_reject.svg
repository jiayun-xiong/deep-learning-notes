<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>接受与补采：两条路怎么拼回目标分布</title>
<desc>把草稿分布 q 与目标分布 p 叠在同一刻度上，绿段是两者共有的部分（照收），橙段是 q 多给的部分（按比例削掉），蓝段是 p 多要的部分（拒绝后用残差补采）。三者相加逐点等于 p。</desc>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">两条路怎么拼回目标分布</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">以代算的 q =（0.5, 0.3, 0.2）、p =（0.3, 0.6, 0.1）为例，同为词 A、B、C</text>

<text x="24" y="76" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#2C2C2A">把 q 与 p 叠在同一把尺子上</text>

<line x1="46" y1="100" x2="46" y2="282" stroke="#888780" stroke-width="0.8"/>
<line x1="46" y1="282" x2="342" y2="282" stroke="#888780" stroke-width="0.8"/>
<text x="40" y="286" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">0</text>
<text x="40" y="229" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">0.2</text>
<text x="40" y="173" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">0.4</text>
<text x="40" y="116" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">0.6</text>

<!-- A: q=0.5 p=0.3 -->
<rect x="74" y="197" width="66" height="85" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="74" y="141" width="66" height="56" fill="#F7D5C3" stroke="#C2410C" stroke-width="0.6"/>
<text x="107" y="240" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#04342C">0.30</text>
<text x="107" y="174" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#7A2E08">0.20</text>
<text x="107" y="298" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">词 A</text>
<text x="107" y="312" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">q 0.5 / p 0.3</text>

<!-- B: q=0.3 p=0.6 -->
<rect x="172" y="197" width="66" height="85" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="172" y="112" width="66" height="85" fill="#CFE0F0" stroke="#2C6E9B" stroke-width="0.6"/>
<text x="205" y="240" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#04342C">0.30</text>
<text x="205" y="158" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#1F4E6B">0.30</text>
<text x="205" y="298" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">词 B</text>
<text x="205" y="312" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">q 0.3 / p 0.6</text>

<!-- C: q=0.2 p=0.1 -->
<rect x="270" y="254" width="66" height="28" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="270" y="225" width="66" height="29" fill="#F7D5C3" stroke="#C2410C" stroke-width="0.6"/>
<text x="303" y="272" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#04342C">0.10</text>
<text x="303" y="244" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#7A2E08">0.10</text>
<text x="303" y="298" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">词 C</text>
<text x="303" y="312" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">q 0.2 / p 0.1</text>

<!-- 图例 -->
<rect x="74" y="330" width="10" height="10" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="90" y="339" font-family="PingFang SC, sans-serif" font-size="9" fill="#04342C">两边共有</text>
<rect x="160" y="330" width="10" height="10" fill="#F7D5C3" stroke="#C2410C" stroke-width="0.5"/>
<text x="176" y="339" font-family="PingFang SC, sans-serif" font-size="9" fill="#7A2E08">q 多给的</text>
<rect x="246" y="330" width="10" height="10" fill="#CFE0F0" stroke="#2C6E9B" stroke-width="0.5"/>
<text x="262" y="339" font-family="PingFang SC, sans-serif" font-size="9" fill="#1F4E6B">p 多要的</text>

<line x1="356" y1="100" x2="356" y2="348" stroke="#D5D3CB" stroke-width="0.8" stroke-dasharray="4 4"/>

<!-- 右栏：两条路 -->
<text x="376" y="104" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#04342C">两条路各管一块</text>

<text x="376" y="130" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" fill="#2C2C2A">① 照收：只收绿段</text>
<text x="376" y="150" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">从 q 抽到 x 的概率是 q(x)，再乘接受率</text>
<text x="376" y="167" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">min(1, p/q)，乘积就是 min(q, p)。</text>
<text x="376" y="184" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#7A2E08">q 抬高的那部分（橙）被按比例削掉。</text>

<text x="376" y="214" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" fill="#2C2C2A">② 补采：正好补齐蓝段</text>
<text x="376" y="234" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">被拒的总概率 = 1 − 总和(绿) = 总和(蓝)。</text>
<text x="376" y="251" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">按各词的缺口 max(0, p−q) 比例重抽一次，</text>
<text x="376" y="268" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#1F4E6B">缺多少补多少，不碰已经够的词。</text>

<text x="376" y="298" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#04342C">代算：A 贡献 0.3×1 = 0.3（全收）；</text>
<text x="376" y="315" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#04342C">A 抽到但被拒的部分 0.2，加 C 的 0.1，</text>
<text x="376" y="332" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#04342C">共 0.3 全给 B —— 于是 B 拿到 0.6。</text>

<text x="24" y="376" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">绿 + 橙本来就是 q；绿 + 蓝本来就是 p。所以「绿 + 蓝」恰好等于 p，逐点成立、无需近似。</text>
<text x="24" y="398" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">比标准拒绝采样省事：不必估概率上界 M，多出来的质量由残差补采自动兜住。</text>
</svg>
