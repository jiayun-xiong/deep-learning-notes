<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img">
<title>一次前向为什么能拿到每个位置的分布</title>
<desc>因果 mask 让位置 t 的输出只依赖它左边的 token；串行生成卡在「下一个输入还不知道」，而验证时草稿已经把输入填满，所以 γ 个位置可以在同一次前向里算完。</desc>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">一次前向为什么能拿到每个位置的分布</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">因果 mask 只允许位置 t 看左边——正是这一点让并行验证合法</text>

<!-- 一、mask 网格 -->
<text x="52" y="70" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">列 = 能看到的输入</text>
<text x="65" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">1</text>
<text x="91" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">2</text>
<text x="117" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">3</text>
<text x="143" y="86" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">4</text>
<text x="44" y="104" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">1</text>
<text x="44" y="130" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">2</text>
<text x="44" y="156" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">3</text>
<text x="44" y="182" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">4</text>

<rect x="52" y="90" width="26" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="78" y="90" width="26" height="26" fill="#FCFCFA" stroke="#D5D3CB" stroke-width="0.6"/>
<rect x="104" y="90" width="26" height="26" fill="#FCFCFA" stroke="#D5D3CB" stroke-width="0.6"/>
<rect x="130" y="90" width="26" height="26" fill="#FCFCFA" stroke="#D5D3CB" stroke-width="0.6"/>
<rect x="52" y="116" width="26" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="78" y="116" width="26" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="104" y="116" width="26" height="26" fill="#FCFCFA" stroke="#D5D3CB" stroke-width="0.6"/>
<rect x="130" y="116" width="26" height="26" fill="#FCFCFA" stroke="#D5D3CB" stroke-width="0.6"/>
<rect x="52" y="142" width="26" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="78" y="142" width="26" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="104" y="142" width="26" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="130" y="142" width="26" height="26" fill="#FCFCFA" stroke="#D5D3CB" stroke-width="0.6"/>
<rect x="52" y="168" width="26" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="78" y="168" width="26" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="104" y="168" width="26" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>
<rect x="130" y="168" width="26" height="26" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.6"/>

<text x="52" y="212" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">行 = 正在算哪个位置</text>
<text x="52" y="228" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#1D9E75">绿 = 看得到，白 = 被挡住</text>

<text x="206" y="100" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" fill="#04342C">mask 给的是一条硬约束：</text>
<text x="206" y="122" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">位置 t 的输出，只由它左边的 token 决定；</text>
<text x="206" y="142" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">后面填什么，都不会改变前面已经算出的分布。</text>
<text x="206" y="170" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">于是草稿 token 一填进输入，那 γ 个位置就退化成</text>
<text x="206" y="190" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">「给定前缀下的普通打分」——可以一次算完。</text>

<line x1="24" y1="248" x2="656" y2="248" stroke="#D5D3CB" stroke-width="0.8" stroke-dasharray="4 4"/>

<!-- 二、串行：卡在输入 -->
<text x="24" y="272" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#7A2E08">串行生成：卡在「下一个输入还不知道」</text>
<rect x="24" y="284" width="92" height="42" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/>
<text x="70" y="302" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A">算位置 t</text>
<text x="70" y="316" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A">的分布</text>
<rect x="136" y="284" width="92" height="42" rx="5" fill="#F7D5C3" stroke="#C2410C" stroke-width="0.7"/>
<text x="182" y="302" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#7A2E08">从分布采样</text>
<text x="182" y="316" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#7A2E08">出一个词</text>
<rect x="248" y="284" width="76" height="42" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.7" stroke-dasharray="4 3"/>
<text x="286" y="302" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">算位置</text>
<text x="286" y="316" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">t+1</text>
<line x1="116" y1="305" x2="132" y2="305" stroke="#888780" stroke-width="1" marker-end="url(#ar1)"/>
<line x1="228" y1="305" x2="244" y2="305" stroke="#888780" stroke-width="1" marker-end="url(#ar1)"/>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#888780"/>
</marker>
<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1D9E75"/>
</marker>
</defs>
<text x="24" y="342" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">采样没完成，下一个位置的输入就无从填起——</text>
<text x="24" y="358" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">这不是算力不够，是信息还没产生。</text>

<!-- 三、并行验证 -->
<text x="364" y="272" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#04342C">并行验证：输入已被草稿填满，一次算完</text>
<rect x="364" y="284" width="66" height="32" rx="4" fill="#F7D5C3" stroke="#C2410C" stroke-width="0.7"/>
<rect x="438" y="284" width="66" height="32" rx="4" fill="#F7D5C3" stroke="#C2410C" stroke-width="0.7"/>
<rect x="512" y="284" width="66" height="32" rx="4" fill="#F7D5C3" stroke="#C2410C" stroke-width="0.7"/>
<rect x="586" y="284" width="66" height="32" rx="4" fill="#F7D5C3" stroke="#C2410C" stroke-width="0.7"/>
<text x="397" y="304" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#7A2E08">草稿 1</text>
<text x="471" y="304" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#7A2E08">草稿 2</text>
<text x="545" y="304" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#7A2E08">草稿 3</text>
<text x="619" y="304" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#7A2E08">草稿 4</text>
<line x1="397" y1="316" x2="397" y2="336" stroke="#1D9E75" stroke-width="1" marker-end="url(#ar2)"/>
<line x1="471" y1="316" x2="471" y2="336" stroke="#1D9E75" stroke-width="1" marker-end="url(#ar2)"/>
<line x1="545" y1="316" x2="545" y2="336" stroke="#1D9E75" stroke-width="1" marker-end="url(#ar2)"/>
<line x1="619" y1="316" x2="619" y2="336" stroke="#1D9E75" stroke-width="1" marker-end="url(#ar2)"/>
<rect x="364" y="340" width="288" height="34" rx="5" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.9"/>
<text x="508" y="361" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">4 个位置的真实分布，1 次前向全给出</text>
<text x="364" y="392" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">权重只读一遍；多算的 3 个位置只多几百次乘加。</text>
<text x="364" y="408" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">与「逐个喂入这批草稿」的结果逐位相同。</text>

<text x="24" y="438" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">并行不相容的从来不是「前向」，而是「不知道左边是什么」；草稿把这唯一的缺口填上了。</text>
<text x="24" y="458" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">这也是训练时 teacher forcing 的同一件事：输入都是已知的，就能一次算完所有位置。</text>
</svg>
