<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424" role="img">
<title>Attention 基础：让每个位置自己决定从谁那里取信息</title>
<desc>上排：单头四步（第二节）。下排两张卡：它取代了什么（第一节）、谁能看见谁（第三节）</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Attention 基础：让每个位置自己决定从谁那里取信息</text>

<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">上排：单头四步（第二节）。下排两张卡：它取代了什么（第一节）、谁能看见谁（第三节）</text>

<rect x="24" y="72" width="86" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="67.0" y="96" font-family="PingFang SC, sans-serif" font-size="10.5" text-anchor="middle" fill="#444441">X</text>
<text x="67.0" y="114" font-family="PingFang SC, sans-serif" font-size="9" text-anchor="middle" fill="#888780">11 × 512</text>
<rect x="134" y="72" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="189.0" y="96" font-family="PingFang SC, sans-serif" font-size="10.5" text-anchor="middle" fill="#0C447C">投影 Q / K / V</text>
<text x="189.0" y="114" font-family="PingFang SC, sans-serif" font-size="9" text-anchor="middle" fill="#888780">三个角色，各 11×512</text>
<rect x="268" y="72" width="110" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="323.0" y="96" font-family="PingFang SC, sans-serif" font-size="10.5" text-anchor="middle" fill="#2C2C2A">打分 + 掩码</text>
<text x="323.0" y="114" font-family="PingFang SC, sans-serif" font-size="9" text-anchor="middle" fill="#888780">11 × 11，上三角 −∞</text>
<rect x="402" y="72" width="110" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="457.0" y="96" font-family="PingFang SC, sans-serif" font-size="10.5" text-anchor="middle" fill="#3C3489">softmax + 取 V</text>
<text x="457.0" y="114" font-family="PingFang SC, sans-serif" font-size="9" text-anchor="middle" fill="#888780">每行和为 1</text>
<rect x="536" y="72" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="596.0" y="96" font-family="PingFang SC, sans-serif" font-size="10.5" text-anchor="middle" fill="#04342C">O</text>
<text x="596.0" y="114" font-family="PingFang SC, sans-serif" font-size="9" text-anchor="middle" fill="#888780">11 × 512，回残差</text>
<line x1="110" y1="100" x2="130" y2="100" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="244" y1="100" x2="264" y2="100" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="378" y1="100" x2="398" y2="100" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="512" y1="100" x2="532" y2="100" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M323 128 V206 H178 V236" fill="none" stroke="#888780" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arg)"/>
<path d="M323 128 V206 H502 V236" fill="none" stroke="#888780" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arg)"/>
<rect x="24" y="240" width="308" height="152" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="266" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">它取代了什么</text>
<text x="40" y="290" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">RNN 把整句压进一个定长向量，信息</text>
<text x="40" y="308" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">还得逐格传递；注意力让任意两个位置</text>
<text x="40" y="326" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">直接连边，权重由内容现算——一步直达，</text>
<text x="40" y="344" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">长距离不再衰减。</text>
<text x="40" y="374" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">→ 第一节</text>
<rect x="348" y="240" width="308" height="152" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="364" y="266" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">谁能看见谁</text>
<text x="364" y="290" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">掩码把「不许看」的格子打成 −∞，等于从</text>
<text x="364" y="308" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">softmax 分母里删掉，剩下的按原比例放大；</text>
<text x="364" y="326" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">三种注意力只差 K/V 从哪来，交叉注意力</text>
<text x="364" y="344" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">的矩阵是 m × n，不是方阵。</text>
<text x="364" y="374" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">→ 第三节（图 4、图 5）</text>
</svg>
