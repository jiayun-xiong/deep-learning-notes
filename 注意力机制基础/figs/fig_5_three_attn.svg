<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424" role="img">
<title>三种注意力：只差 K/V 从哪来</title>
<desc>编码器自注意力、掩码自注意力、交叉注意力的 Q/K/V 来源与打分矩阵形状对比。</desc>
<defs>
<marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">三种注意力：算式一字不改，只差 K/V 从哪来、谁能看谁</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">灰格 = 被掩码盖住、不许看的格子；源句 n 个 token、目标句 m 个 token</text>

<rect x="24" y="66" width="204" height="316" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="126" y="90" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">编码器自注意力</text>
<rect x="86" y="104" width="80" height="22" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="126" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#0C447C">X：n × d</text>
<text x="126" y="146" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">Q、K、V 全从 X 来</text>
<rect x="71" y="162" width="110" height="110" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<line x1="81" y1="162" x2="81" y2="272" stroke="#185FA5" stroke-width="0.3"/>
<line x1="91" y1="162" x2="91" y2="272" stroke="#185FA5" stroke-width="0.3"/>
<line x1="101" y1="162" x2="101" y2="272" stroke="#185FA5" stroke-width="0.3"/>
<line x1="111" y1="162" x2="111" y2="272" stroke="#185FA5" stroke-width="0.3"/>
<line x1="121" y1="162" x2="121" y2="272" stroke="#185FA5" stroke-width="0.3"/>
<line x1="131" y1="162" x2="131" y2="272" stroke="#185FA5" stroke-width="0.3"/>
<line x1="141" y1="162" x2="141" y2="272" stroke="#185FA5" stroke-width="0.3"/>
<line x1="151" y1="162" x2="151" y2="272" stroke="#185FA5" stroke-width="0.3"/>
<line x1="161" y1="162" x2="161" y2="272" stroke="#185FA5" stroke-width="0.3"/>
<line x1="171" y1="162" x2="171" y2="272" stroke="#185FA5" stroke-width="0.3"/>
<line x1="71" y1="172" x2="181" y2="172" stroke="#185FA5" stroke-width="0.3"/>
<line x1="71" y1="182" x2="181" y2="182" stroke="#185FA5" stroke-width="0.3"/>
<line x1="71" y1="192" x2="181" y2="192" stroke="#185FA5" stroke-width="0.3"/>
<line x1="71" y1="202" x2="181" y2="202" stroke="#185FA5" stroke-width="0.3"/>
<line x1="71" y1="212" x2="181" y2="212" stroke="#185FA5" stroke-width="0.3"/>
<line x1="71" y1="222" x2="181" y2="222" stroke="#185FA5" stroke-width="0.3"/>
<line x1="71" y1="232" x2="181" y2="232" stroke="#185FA5" stroke-width="0.3"/>
<line x1="71" y1="242" x2="181" y2="242" stroke="#185FA5" stroke-width="0.3"/>
<line x1="71" y1="252" x2="181" y2="252" stroke="#185FA5" stroke-width="0.3"/>
<line x1="71" y1="262" x2="181" y2="262" stroke="#185FA5" stroke-width="0.3"/>
<text x="126" y="292" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">打分矩阵 n × n</text>
<text x="126" y="312" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">整句源句互相可见</text>
<text x="126" y="336" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">无掩码</text>

<rect x="238" y="66" width="204" height="316" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="90" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">掩码自注意力</text>
<rect x="300" y="104" width="80" height="22" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">Y：m × d</text>
<text x="340" y="146" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">Q、K、V 全从 Y 来</text>
<rect x="285" y="162" width="110" height="110" fill="#D9D6F2" stroke="#534AB7" stroke-width="0.5"/>
<polygon points="285,162 285,272 395,272" fill="#EEEDFE"/>
<line x1="285" y1="162" x2="395" y2="272" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="3 2"/>
<line x1="295" y1="162" x2="295" y2="272" stroke="#534AB7" stroke-width="0.25"/>
<line x1="305" y1="162" x2="305" y2="272" stroke="#534AB7" stroke-width="0.25"/>
<line x1="315" y1="162" x2="315" y2="272" stroke="#534AB7" stroke-width="0.25"/>
<line x1="325" y1="162" x2="325" y2="272" stroke="#534AB7" stroke-width="0.25"/>
<line x1="335" y1="162" x2="335" y2="272" stroke="#534AB7" stroke-width="0.25"/>
<line x1="345" y1="162" x2="345" y2="272" stroke="#534AB7" stroke-width="0.25"/>
<line x1="355" y1="162" x2="355" y2="272" stroke="#534AB7" stroke-width="0.25"/>
<line x1="365" y1="162" x2="365" y2="272" stroke="#534AB7" stroke-width="0.25"/>
<line x1="375" y1="162" x2="375" y2="272" stroke="#534AB7" stroke-width="0.25"/>
<line x1="385" y1="162" x2="385" y2="272" stroke="#534AB7" stroke-width="0.25"/>
<line x1="285" y1="172" x2="395" y2="172" stroke="#534AB7" stroke-width="0.25"/>
<line x1="285" y1="182" x2="395" y2="182" stroke="#534AB7" stroke-width="0.25"/>
<line x1="285" y1="192" x2="395" y2="192" stroke="#534AB7" stroke-width="0.25"/>
<line x1="285" y1="202" x2="395" y2="202" stroke="#534AB7" stroke-width="0.25"/>
<line x1="285" y1="212" x2="395" y2="212" stroke="#534AB7" stroke-width="0.25"/>
<line x1="285" y1="222" x2="395" y2="222" stroke="#534AB7" stroke-width="0.25"/>
<line x1="285" y1="232" x2="395" y2="232" stroke="#534AB7" stroke-width="0.25"/>
<line x1="285" y1="242" x2="395" y2="242" stroke="#534AB7" stroke-width="0.25"/>
<line x1="285" y1="252" x2="395" y2="252" stroke="#534AB7" stroke-width="0.25"/>
<line x1="285" y1="262" x2="395" y2="262" stroke="#534AB7" stroke-width="0.25"/>
<text x="340" y="292" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">打分矩阵 m × m</text>
<text x="340" y="312" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">只许看已生成的前文</text>
<text x="340" y="336" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">因果掩码盖住上三角</text>

<rect x="452" y="66" width="204" height="316" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="554" y="90" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#04342C">交叉注意力</text>
<rect x="470" y="104" width="72" height="22" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="506" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">Y：m × d</text>
<rect x="566" y="104" width="72" height="22" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="602" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#0C447C">X：n × d</text>
<text x="554" y="146" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">Q 从 Y 来，K、V 从 X 来</text>
<rect x="499" y="176" width="110" height="70" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<line x1="519" y1="176" x2="519" y2="246" stroke="#1D9E75" stroke-width="0.3"/>
<line x1="539" y1="176" x2="539" y2="246" stroke="#1D9E75" stroke-width="0.3"/>
<line x1="559" y1="176" x2="559" y2="246" stroke="#1D9E75" stroke-width="0.3"/>
<line x1="579" y1="176" x2="579" y2="246" stroke="#1D9E75" stroke-width="0.3"/>
<line x1="599" y1="176" x2="599" y2="246" stroke="#1D9E75" stroke-width="0.3"/>
<line x1="499" y1="196" x2="609" y2="196" stroke="#1D9E75" stroke-width="0.3"/>
<line x1="499" y1="216" x2="609" y2="216" stroke="#1D9E75" stroke-width="0.3"/>
<line x1="499" y1="236" x2="609" y2="236" stroke="#1D9E75" stroke-width="0.3"/>
<text x="554" y="266" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">打分矩阵 m × n</text>
<text x="554" y="286" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">行是目标句、列是源句</text>
<text x="554" y="312" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">不是方阵：m ≠ n</text>
<text x="554" y="336" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">翻译对齐就靠它</text>

<text x="24" y="408" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">三者的 Attention 算式完全相同；掩码体系与解码器的组装方式在装配篇展开，这里只记"K/V 从哪来"。</text>
</svg>
