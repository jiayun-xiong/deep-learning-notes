<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="680" height="404" role="img">
<title>多头的拆分与拼接</title>
<desc>X 拆成 8 个 11×64 的头，各算各的注意力，Concat 回 11×512 后经输出投影融合成 O。</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">多头：把 512 维拆成 8 份，各算各的，再拼回去</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">例句 11 个 token；d = 512、h = 8、每头 64 维（论文取值）</text>

<rect x="16" y="112" width="76" height="120" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<line x1="16" y1="132" x2="92" y2="132" stroke="#185FA5" stroke-width="0.4"/>
<line x1="16" y1="152" x2="92" y2="152" stroke="#185FA5" stroke-width="0.4"/>
<line x1="16" y1="172" x2="92" y2="172" stroke="#185FA5" stroke-width="0.4"/>
<line x1="16" y1="192" x2="92" y2="192" stroke="#185FA5" stroke-width="0.4"/>
<line x1="16" y1="212" x2="92" y2="212" stroke="#185FA5" stroke-width="0.4"/>
<line x1="41" y1="112" x2="41" y2="232" stroke="#185FA5" stroke-width="0.4"/>
<line x1="67" y1="112" x2="67" y2="232" stroke="#185FA5" stroke-width="0.4"/>
<text x="54" y="254" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">X：11 × 512</text>

<line x1="92" y1="172" x2="126" y2="172" stroke="#888780" stroke-width="1.2" marker-end="url(#a2)"/>
<text x="109" y="158" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#5F5E5A">拆 8 份</text>

<rect x="132" y="76" width="248" height="196" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="256" y="100" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#2C2C2A">每个头（×8，结构完全相同）</text>

<rect x="156" y="116" width="200" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="256" y="135" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0C447C">Q / K / V：各 11 × 64</text>
<line x1="256" y1="146" x2="256" y2="160" stroke="#888780" stroke-width="1.1" marker-end="url(#a2)"/>

<rect x="156" y="162" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="256" y="181" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">Attention：Scores 11 × 11</text>
<line x1="256" y1="192" x2="256" y2="206" stroke="#888780" stroke-width="1.1" marker-end="url(#a2)"/>

<rect x="156" y="208" width="200" height="30" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
<text x="256" y="227" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#04342C">这一头的输出：11 × 64</text>

<text x="256" y="262" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">每头一套独立的投影矩阵，各 512 × 64</text>

<line x1="382" y1="174" x2="400" y2="174" stroke="#888780" stroke-width="1.2" marker-end="url(#a2)"/>
<text x="391" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">×8</text>

<rect x="404" y="104" width="60" height="140" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="434" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" fill="#3C3489">Concat</text>
<text x="434" y="188" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#3C3489">11 × 512</text>

<line x1="464" y1="174" x2="486" y2="174" stroke="#888780" stroke-width="1.2" marker-end="url(#a2)"/>

<rect x="488" y="134" width="96" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<svg x="524.3" y="159.6" width="23.4" height="12.7" viewBox="0 0 1952 1055"><g fill="currentColor" stroke-width="0" transform="translate(0 1030.0) scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D44A" d="M436 683Q450 683 486 682T553 680Q604 680 638 681T677 682Q695 682 695 674Q695 670 692 659Q687 641 683 639T661 637Q636 636 621 632T600 624T597 615Q597 603 613 377T629 138L631 141Q633 144 637 151T649 170T666 200T690 241T720 295T759 362Q863 546 877 572T892 604Q892 619 873 628T831 637Q817 637 817 647Q817 650 819 660Q823 676 825 679T839 682Q842 682 856 682T895 682T949 681Q1015 681 1034 683Q1048 683 1048 672Q1048 666 1045 655T1038 640T1028 637Q1006 637 988 631T958 617T939 600T927 584L923 578L754 282Q586 -14 585 -15Q579 -22 561 -22Q546 -22 542 -17Q539 -14 523 229T506 480L494 462Q472 425 366 239Q222 -13 220 -15T215 -19Q210 -22 197 -22Q178 -22 176 -15Q176 -12 154 304T131 622Q129 631 121 633T82 637H58Q51 644 51 648Q52 671 64 683H76Q118 680 176 680Q301 680 313 683H323Q329 677 329 674T327 656Q322 641 318 637H297Q236 634 232 620Q262 160 266 136L501 550L499 587Q496 629 489 632Q483 636 447 637Q428 637 422 639T416 648Q416 650 418 660Q419 664 420 669T421 676T424 680T428 682T436 683Z"></path></g><g data-mml-node="TeXAtom" transform="translate(1136.2,413) scale(0.707)" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g></g></g></g></g></svg>
<text x="536" y="192" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#3C3489">512 × 512</text>

<line x1="584" y1="174" x2="606" y2="174" stroke="#888780" stroke-width="1.2" marker-end="url(#a2)"/>

<rect x="608" y="140" width="48" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="632" y="170" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">O</text>
<text x="632" y="188" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">11 × 512</text>

<rect x="24" y="296" width="632" height="88" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="320" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">参数账：每头 3 个投影各 512×64，8 个头合计 8 × 3 × 512 × 64 = 3 × 512² —— 与单头完全相同，多头不额外花参数</text>
<text x="40" y="342" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">唯一的增量是 Concat 之后的输出投影（512×512）：8 份 64 维的结论由它重新融合成 512 维</text>
<text x="40" y="364" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">为什么拼接而不是相加：相加把 8 个头的数混进同一批坐标，谁说的无从分辨；拼接保留位置，输出投影才学得出该听谁的</text>
</svg>
