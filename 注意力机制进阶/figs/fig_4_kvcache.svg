<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">LLaMA-2 70B 配置：80 层、64 个 Q 头、每头 128 维、fp16；GQA 为 8 组 KV 头</text>

