<text x="24" y="366" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">公式里 MHA 的 h = 64；换成 GQA 后只需把 h 换成 KV 组数 8，其余一项不动——cache 恰好缩到 1/8。</text>
<text x="24" y="386" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">且推理每一步都要把整份 cache 读完才算得出下一个词：省显存的同时，也省了每一帧的读取带宽。</text>
