<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" width="680" height="366" role="img">
<title>块取多大：把片上空间逐项加出来</title>
<desc>按 fp16 逐项累加，128 行的方案需要 113 KB，装进 A100 单块 164 KB 的上限；改成 256 行需要约 192 KB，装不下。</desc>
<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">块取多大：把片上空间逐项加出来</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">前提：每头 d_k = 64（512 ÷ 8 头）、fp16 每数 2 字节、A100 单个计算块可用共享内存 164 KB</text>

<rect x="24" y="62" width="632" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="40" y="80" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">Q 块：128 行 × 64 维 × 2 B</text>
<text x="640" y="80" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">16 KB</text>

<rect x="24" y="94" width="632" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="40" y="112" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">K 块：128 列 × 64 维 × 2 B</text>
<text x="640" y="112" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">16 KB</text>

<rect x="24" y="126" width="632" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="40" y="144" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">V 块：128 列 × 64 维 × 2 B</text>
<text x="640" y="144" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">16 KB</text>

<rect x="24" y="158" width="632" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="40" y="176" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">S 块：这一块的分数 128 × 128 × 2 B（唯一随 L² 增长的量）</text>
<text x="640" y="176" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">32 KB</text>

<rect x="24" y="190" width="632" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="40" y="208" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">acc：跨块累加的输出，存 fp32（4 B，不能丢精度）</text>
<text x="640" y="208" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" fill="#0C447C">32 KB</text>

<rect x="24" y="222" width="632" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="40" y="240" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">m、l：每行一个 running max 和指数和</text>
<text x="640" y="240" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">1 KB</text>

<text x="40" y="278" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">合计 113 KB</text>
<text x="160" y="278" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">对 164 KB 的上限</text>
<rect x="24" y="288" width="632" height="12" rx="6" fill="#F1EFE8"/>
<rect x="24" y="288" width="435" height="12" rx="6" fill="#185FA5"/>
<text x="656" y="318" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">113 / 164 KB，还剩 51 KB</text>

<text x="24" y="340" font-family="PingFang SC, sans-serif" font-size="11" fill="#A32D2D">把行数改成 256：32 + 16 + 16 + 64 + 64 = 192 KB &gt; 164 KB，装不下——128 是「再大一号就爆」的那一档</text>
<text x="24" y="358" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">块越大，K/V 要付的重读遍数越少；所以块取「装得下的最大值」，而不是某个规定常数。</text>
</svg>
