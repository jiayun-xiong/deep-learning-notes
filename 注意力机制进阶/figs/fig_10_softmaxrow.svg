<text x="276" y="70" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle" fill="#2C2C2A">P = Softmax(S)</text>
<ellipse cx="276" cy="143" rx="60" ry="16" fill="none" stroke="#C0392B" stroke-width="1.4"/>
<rect x="392" y="88" width="264" height="84" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.6"/>
<text x="408" y="112" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">第 3 行的每个格子：</text>
<text x="408" y="134" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#0C447C">p = e^s ÷ ( e^2 + e^1 + e^4 + e^3 )</text>
<text x="408" y="156" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#C0392B">分母只在本行内求和——其他行</text>
<text x="408" y="171" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#C0392B">跟它一点关系都没有。</text>
<text x="60" y="216" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">蓝色高亮那行就是下面放大的第 3 行；P 的其余行各算各的，互不影响。</text>
<line x1="24" y1="236" x2="656" y2="236" stroke="#888780" stroke-width="0.6" stroke-dasharray="3 3"/>
<text x="24" y="258" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#2C2C2A">放大第 3 行：分母被切成两段</text>
<rect x="60" y="276" width="28" height="28" rx="2" fill="#6B6B66" stroke="#888780" stroke-width="0.6"/>
<text x="74" y="295" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#FFFFFF">2</text>
<rect x="90" y="276" width="28" height="28" rx="2" fill="#6B6B66" stroke="#888780" stroke-width="0.6"/>
<text x="104" y="295" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#FFFFFF">1</text>
<rect x="120" y="276" width="28" height="28" rx="2" fill="#D8D6CE" stroke="#888780" stroke-width="0.6"/>
<text x="134" y="295" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#2C2C2A">4</text>
<rect x="150" y="276" width="28" height="28" rx="2" fill="#D8D6CE" stroke="#888780" stroke-width="0.6"/>
<text x="164" y="295" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#2C2C2A">3</text>
<text x="60" y="270" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">S 第 3 行</text>
<text x="186" y="295" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780">切成两块</text>
<rect x="60" y="320" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.6"/>
<text x="74" y="342" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" fill="#0C447C">块 1 [2, 1]</text>
<text x="74" y="362" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A">局部最大 m₁ = 2</text>
<text x="74" y="380" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A">部分和 l₁ = e⁰ + e⁻¹</text>
<text x="74" y="398" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="500" fill="#0C447C">　　　= 1.368</text>
<rect x="270" y="320" width="190" height="96" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.6"/>
<text x="284" y="342" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" fill="#3C3489">块 2 [4, 3]</text>
<text x="284" y="362" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A">局部最大 m₂ = 4</text>
<text x="284" y="380" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A">部分和 l₂ = e⁰ + e⁻¹</text>
<text x="284" y="398" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="500" fill="#3C3489">　　　= 1.368</text>
<text x="252" y="372" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#444441">+</text>
<rect x="480" y="320" width="176" height="96" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.7"/>
<text x="494" y="342" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#04342C">换算到同一基准再相加：</text>
<text x="494" y="362" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A">l₁ × e^(2−4) = 0.185</text>
<text x="494" y="382" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A">l = 0.185 + 1.368</text>
<text x="494" y="400" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" fill="#04342C">　= 1.553 ✓</text>
<line x1="462" y1="368" x2="478" y2="368" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="24" y="424" width="632" height="0.1" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="60" y="446" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">分块只切列（K/V 的方向）；行从来没被切开——所以只要把每行的分母「边攒边换算」，分块就不破坏 softmax。</text>
</svg>
