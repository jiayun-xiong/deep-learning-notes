<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="680" height="404" role="img">
<title>MHA、MQA、GQA 的 KV 共享方式</title>
<desc>圆 = Q 头，方块 = 一组 KV；连线表示该 Q 头用哪组 KV。KV cache 大小与 KV 组数成正比。</desc>
<defs>
<marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B9B7B0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">MHA → MQA → GQA：把 KV 组数减下来</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">○ = Q 头，▭ = 一组 KV；连线 = 这个 Q 头用哪组 KV（每组 KV 含一份 K 投影和一份 V 投影）</text>

