<text x="554" y="298" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">LLaMA-2 70B：64 个 Q / 8 组</text>

<rect x="24" y="340" width="632" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="360" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">cache 的大小与 KV 组数成正比：组数减到 1/8，cache 就缩到 1/8——省的是显存，不是参数</text>
<text x="40" y="380" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">KV 投影矩阵只占全部参数的一小角；省下的显存用来放更大的 batch 和更长的上下文</text>
