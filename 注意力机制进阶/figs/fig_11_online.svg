<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 506" width="680" height="506" role="img">
<title>分块算 softmax：为什么不能直接加，而要缩放</title>
<desc>一个 token、4 个 key、d_k=3 的两块计算：第 2 块出现更大的最大值后，旧 acc 与旧 l 一起乘 0.135 换算，再并入新块，最后除以 l 得权重。</desc>
<text x="24" y="26" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">分块算 softmax：为什么不能直接加，而要缩放</text>
<text x="24" y="46" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">一个 token、4 个 key、d_k = 3；真实情况是 128 行一起算，m 与 l 每行各一套</text>
<rect x="16" y="58" width="648" height="86" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="32" y="78" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" fill="#2C2C2A">先纠形状：acc 的形状永远等于 Q 块，不是正方形</text>
<rect x="32" y="88" width="96" height="24" rx="5" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="80.0" y="103.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#2C2C2A">Q 块 128×64</text>
<rect x="140" y="88" width="96" height="24" rx="5" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="188.0" y="103.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#2C2C2A">K/V 块 128×64</text>
<rect x="248" y="88" width="96" height="24" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="296.0" y="103.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#0C447C">S = P 128×128</text>
<rect x="356" y="88" width="96" height="24" rx="5" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="404.0" y="103.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#2C2C2A">V 块 128×64</text>
<rect x="464" y="88" width="96" height="24" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="512.0" y="103.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#3C3489">acc 128×64</text>
<rect x="572" y="88" width="96" height="24" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text x="620.0" y="103.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#3C3489">O 块 128×64</text>
<text x="32" y="128" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">只有 S 是正方形——因为两块都取了 128；acc 跟 Q 块同形，随 d_k 变成长方形。本例 d_k = 3，所以 acc 是 1×3。</text>
<rect x="16" y="152" width="648" height="250" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="28" y="172" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" fill="#2C2C2A">① 第 1 块：分数 [2, 1]</text>
<text x="250" y="172" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" fill="#2C2C2A">② 第 2 块：分数 [4, 3]，冒出更大的 4</text>
<text x="470" y="172" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" fill="#2C2C2A">③ 最后 ÷ l</text>
<text x="28" y="198" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">分数</text>
<rect x="88" y="184" width="26" height="20" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="101.0" y="197.2" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#2C2C2A">2</text><rect x="117" y="184" width="26" height="20" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="130.0" y="197.2" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#2C2C2A">1</text>
<text x="28" y="226" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">减 c = m₁ = 2，取指数</text>
<rect x="88" y="232" width="34" height="20" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="105.0" y="245.2" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#2C2C2A">1.000</text><rect x="125" y="232" width="34" height="20" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="142.0" y="245.2" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#2C2C2A">0.368</text>
<text x="28" y="268" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">× V₁（2×3）加权求和 → 累加器</text>
<rect x="28" y="276" width="176" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="116" y="290.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#0C447C">1.000·v₁ + 0.368·v₂</text>
<text x="28" y="316" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">l₁ = 1.000 + 0.368 = 1.368</text>
<text x="250" y="198" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">分数</text>
<rect x="310" y="184" width="26" height="20" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="323.0" y="197.2" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#2C2C2A">4</text><rect x="339" y="184" width="26" height="20" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/><text x="352.0" y="197.2" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#2C2C2A">3</text>
<text x="250" y="226" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#A32D2D">新 m = 4 > 2：参照值必须换</text>
<text x="250" y="246" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">先：旧账 × e^(2−4) = 0.135，l 1.368 → 0.185</text>
<text x="250" y="264" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">再：新块 e^(s−4) = [1.000, 0.368]，× V₂ 加上</text>
<rect x="250" y="272" width="200" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="350" y="286.5" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8.5" font-weight="400" fill="#0C447C">0.135·v₁+0.050·v₂+1.000·v₃+0.368·v₄</text>
<text x="250" y="316" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#2C2C2A">l = 0.185 + 1.368 = 1.553</text>
<text x="470" y="226" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">acc ÷ 1.553 = 权重</text>
<rect x="470" y="232" width="32" height="20" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/><text x="486.0" y="245.2" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#27500A">0.087</text><rect x="505" y="232" width="32" height="20" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/><text x="521.0" y="245.2" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#27500A">0.032</text><rect x="540" y="232" width="32" height="20" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/><text x="556.0" y="245.2" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#27500A">0.644</text><rect x="575" y="232" width="32" height="20" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/><text x="591.0" y="245.2" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#27500A">0.237</text>
<text x="470" y="268" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">4 个权重，和为 1</text>
<text x="470" y="286" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#5F5E5A">与一次性算全局 softmax</text>
<text x="470" y="302" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#27500A">逐位相同</text>
<rect x="16" y="414" width="648" height="70" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
<text x="32" y="434" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" fill="#A32D2D">反例：不换算、直接加会错成什么样</text>
<text x="32" y="454" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#501313">l = 1 + 0.368 + 1 + 0.368 = 2.736 → 权重 [0.366, 0.134, 0.366, 0.134]（正确值是 [0.087, 0.032, 0.644, 0.237]）</text>
<text x="32" y="472" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="400" fill="#501313">错因：旧账以 c = 2 为参照、新账以 c = 4 为参照，同一个分数换参照就小 e² = 7.39 倍——不换算直接加，等于米加厘米。</text>
<text x="24" y="498" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#5F5E5A">为什么非要减 c：fp16 上限 65504，而 e^11.1 ≈ 65504，分数一过 11 就溢出成 inf；减掉 c 后最大项恰好是 e⁰ = 1，全落在 (0,1] 里。</text>
</svg>