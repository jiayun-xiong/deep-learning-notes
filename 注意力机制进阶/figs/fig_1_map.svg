<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img">
<title>Attention 进阶：多头、KV cache 与 FlashAttention</title>
<desc>上排：能力从哪来（第一节）。下排两条账单：推理端（第二～三节）、训练端（第四节）</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Attention 进阶：多头、KV cache 与 FlashAttention</text>

<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">上排：能力从哪来（第一节）。下排两条账单：推理端（第二～三节）、训练端（第四节）</text>

<rect x="24" y="72" width="122" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="85.0" y="96" font-family="PingFang SC, sans-serif" font-size="10.5" text-anchor="middle" fill="#444441">单头</text>
<text x="85.0" y="114" font-family="PingFang SC, sans-serif" font-size="9" text-anchor="middle" fill="#888780">只有一份 softmax</text>
<rect x="172" y="72" width="112" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="228.0" y="96" font-family="PingFang SC, sans-serif" font-size="10.5" text-anchor="middle" fill="#0C447C">沿列切成 h 条</text>
<text x="228.0" y="114" font-family="PingFang SC, sans-serif" font-size="9" text-anchor="middle" fill="#888780">h · d · dk = d²</text>
<rect x="310" y="72" width="122" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="371.0" y="96" font-family="PingFang SC, sans-serif" font-size="10.5" text-anchor="middle" fill="#3C3489">h 个头</text>
<text x="371.0" y="114" font-family="PingFang SC, sans-serif" font-size="9" text-anchor="middle" fill="#888780">h 份独立 softmax 预算</text>
<rect x="458" y="72" width="198" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="557.0" y="96" font-family="PingFang SC, sans-serif" font-size="10.5" text-anchor="middle" fill="#04342C">Concat + W^O 融合</text>
<text x="557.0" y="114" font-family="PingFang SC, sans-serif" font-size="9" text-anchor="middle" fill="#888780">参数仍是 4d²，效果 24.9 → 25.8 BLEU</text>
<line x1="149" y1="100" x2="169" y2="100" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="287" y1="100" x2="307" y2="100" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="435" y1="100" x2="455" y2="100" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<path d="M366 128 V172 H178 V206" fill="none" stroke="#888780" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arg)"/>
<path d="M366 128 V172 H502 V206" fill="none" stroke="#888780" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arg)"/>
<rect x="24" y="210" width="308" height="232" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="236" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">推理账单：KV cache</text>
<text x="40" y="260" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">只存 K/V：因果掩码下它们算过就不变，</text>
<text x="40" y="278" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">每步变动的只有 Q。</text>
<text x="40" y="296" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">cache = 2 · N · L · h · dk · B，</text>
<text x="40" y="314" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">70B / 4k 上下文：10.7 GB，decode 是</text>
<text x="40" y="332" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">memory-bound——带宽比算力先吃紧。</text>
<text x="40" y="356" font-family="PingFang SC, sans-serif" font-size="10" fill="#0C447C">GQA：h 个 Q 头分 g 组共享 KV，</text>
<text x="40" y="374" font-family="PingFang SC, sans-serif" font-size="10" fill="#0C447C">10.7 → 1.34 GB（1/8），省的是带宽。</text>
<text x="40" y="404" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">→ 第二节、第三节（图 4、图 5）</text>
<rect x="348" y="210" width="308" height="232" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="364" y="236" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">训练账单：L × L 打分矩阵</text>
<text x="364" y="260" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">时间 O(L²d)、显存 O(L²h)；8192 长、</text>
<text x="364" y="278" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">32 头时单层 4 GB——长上下文放不下。</text>
<text x="364" y="302" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">FlashAttention：不建那张表，块留在</text>
<text x="364" y="320" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">片上，分母靠 online softmax 边攒边补；</text>
<text x="364" y="338" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">精确等价，搬运 1/4、峰值 1/300。</text>
<text x="364" y="362" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">滑窗：只看最近 w 个位置，计算与 cache</text>
<text x="364" y="380" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A">降到 w——但这是真近似。</text>
<text x="364" y="404" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">→ 第四节（图 6 ～ 图 9）</text>
</svg>
