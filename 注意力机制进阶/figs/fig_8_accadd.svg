<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" width="680" height="448" role="img">
<title>两轮的 acc 怎么相加：形状从头到尾不变，先换算、再对格相加</title>
<desc>一行 4 个分数 [2, 1 | 4, 3] 切成两块；每头 2 维，v₁=(2,0) v₂=(0,2) v₃=(4,0) v₄=(0,4)。acc 始终是 1×2 的行向量</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="13.5" font-weight="500" fill="#2C2C2A" >两轮的 acc 怎么相加：形状从头到尾不变，先换算、再对格相加</text>

<text x="24" y="45" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A" >一行 4 个分数 [2, 1 | 4, 3] 切成两块；每头 2 维，v₁=(2,0) v₂=(0,2) v₃=(4,0) v₄=(0,4)。acc 始终是 1×2 的行向量</text>

<rect x="24" y="64" width="200" height="306" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.6"/>
<text x="36" y="86" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C" >① 第 1 轮：攒出部分和</text>
<rect x="252" y="64" width="200" height="306" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.6"/>
<text x="264" y="86" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#C0392B" >② 第 2 轮：先把旧账换算</text>
<rect x="480" y="64" width="200" height="306" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.6"/>
<text x="492" y="86" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#04342C" >③ 并入新块，最后归一化</text>
<rect x="36" y="120" width="22" height="22" rx="2" fill="#6B6B66" stroke="#888780" stroke-width="0.6"/>
<text x="47" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#FFFFFF" >2</text>
<rect x="60" y="120" width="22" height="22" rx="2" fill="#6B6B66" stroke="#888780" stroke-width="0.6"/>
<text x="71" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#FFFFFF" >1</text>
<rect x="84" y="120" width="22" height="22" rx="2" fill="#ECEAE3" stroke="#888780" stroke-width="0.6"/>
<text x="95" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#888780" >4</text>
<rect x="108" y="120" width="22" height="22" rx="2" fill="#ECEAE3" stroke="#888780" stroke-width="0.6"/>
<text x="119" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#888780" >3</text>
<text x="36" y="114" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >S 的这一行</text>
<text x="36" y="168" font-family="PingFang SC, sans-serif" font-size="9" fill="#444441" >块 1 的分数，减本块最大值 2：</text>
<text x="36" y="184" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" fill="#2C2C2A" >p = [1.000, 0.368]</text>
<line x1="124" y1="192" x2="124" y2="206" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="36" y="210" width="46" height="30" rx="3" fill="#DCE9F7" stroke="#185FA5" stroke-width="0.8"/>
<text x="59" y="229" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle" fill="#0C447C" >2.000</text>
<rect x="84" y="210" width="46" height="30" rx="3" fill="#DCE9F7" stroke="#185FA5" stroke-width="0.8"/>
<text x="107" y="229" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle" fill="#0C447C" >0.736</text>
<text x="132" y="229" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >acc（1×2）</text>
<text x="36" y="256" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >acc = 1.000·v₁ + 0.368·v₂</text>
<text x="36" y="278" font-family="PingFang SC, sans-serif" font-size="9" fill="#444441" >记下两个统计量：</text>
<text x="36" y="294" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A" >m = 2（本块最大）</text>
<text x="36" y="310" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A" >l = 1.368（指数和）</text>
<text x="36" y="334" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >此刻它只是部分和，</text>
<text x="36" y="349" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >还不是输出。</text>
<rect x="264" y="120" width="22" height="22" rx="2" fill="#D8D6CE" stroke="#888780" stroke-width="0.6"/>
<text x="275" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#444441" >2</text>
<rect x="288" y="120" width="22" height="22" rx="2" fill="#D8D6CE" stroke="#888780" stroke-width="0.6"/>
<text x="299" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#444441" >1</text>
<rect x="312" y="120" width="22" height="22" rx="2" fill="#6B6B66" stroke="#888780" stroke-width="0.6"/>
<text x="323" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#FFFFFF" >4</text>
<rect x="336" y="120" width="22" height="22" rx="2" fill="#6B6B66" stroke="#888780" stroke-width="0.6"/>
<text x="347" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#FFFFFF" >3</text>
<text x="264" y="114" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >S 的这一行</text>
<text x="264" y="168" font-family="PingFang SC, sans-serif" font-size="9" fill="#444441" >块 2 冒出更大的 4，m: 2 → 4。</text>
<text x="264" y="184" font-family="PingFang SC, sans-serif" font-size="9" fill="#444441" >旧账按旧基准记的，先统一单位：</text>
<rect x="264" y="192" width="176" height="24" rx="3" fill="#FBEDEB" stroke="#C0392B" stroke-width="0.7"/>
<text x="352" y="208" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#C0392B" >整体 × e^(2−4) = 0.135</text>
<rect x="264" y="234" width="46" height="30" rx="3" fill="#DCE9F7" stroke="#185FA5" stroke-width="0.8"/>
<text x="287" y="253" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle" fill="#0C447C" >0.270</text>
<rect x="312" y="234" width="46" height="30" rx="3" fill="#DCE9F7" stroke="#185FA5" stroke-width="0.8"/>
<text x="335" y="253" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle" fill="#0C447C" >0.100</text>
<text x="360" y="253" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >acc（1×2）</text>
<text x="287" y="229" font-family="PingFang SC, sans-serif" font-size="8.5" text-anchor="middle" fill="#888780" >原 2.000</text>
<text x="335" y="229" font-family="PingFang SC, sans-serif" font-size="8.5" text-anchor="middle" fill="#888780" >原 0.736</text>
<text x="264" y="280" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >每个格子同乘，形状不变</text>
<text x="264" y="302" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A" >l 同乘：1.368 → 0.185</text>
<text x="264" y="326" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >换算不是修正错误，是把</text>
<text x="264" y="341" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >两段记在不同的基准上，</text>
<text x="264" y="356" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >相加前必须换到同一基准。</text>
<rect x="492" y="120" width="22" height="22" rx="2" fill="#ECEAE3" stroke="#888780" stroke-width="0.6"/>
<text x="503" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#444441" >2</text>
<rect x="516" y="120" width="22" height="22" rx="2" fill="#ECEAE3" stroke="#888780" stroke-width="0.6"/>
<text x="527" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#444441" >1</text>
<rect x="540" y="120" width="22" height="22" rx="2" fill="#ECEAE3" stroke="#888780" stroke-width="0.6"/>
<text x="551" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#444441" >4</text>
<rect x="564" y="120" width="22" height="22" rx="2" fill="#ECEAE3" stroke="#888780" stroke-width="0.6"/>
<text x="575" y="135" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" text-anchor="middle" fill="#444441" >3</text>
<text x="492" y="114" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >S 的这一行</text>
<text x="492" y="168" font-family="PingFang SC, sans-serif" font-size="9" fill="#444441" >新块的贡献（p = [1.000, 0.368]）：</text>
<text x="492" y="184" font-family="PingFang SC, sans-serif" font-size="10" font-weight="500" fill="#2C2C2A" >1.000·v₃ + 0.368·v₄ = (4.000, 1.472)</text>
<text x="492" y="206" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#444441" >对格相加：</text>
<text x="492" y="222" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#2C2C2A" >(0.270, 0.100) + (4.000, 1.472)</text>
<rect x="492" y="234" width="46" height="30" rx="3" fill="#DCE9F7" stroke="#185FA5" stroke-width="0.8"/>
<text x="515" y="253" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle" fill="#0C447C" >4.270</text>
<rect x="540" y="234" width="46" height="30" rx="3" fill="#DCE9F7" stroke="#185FA5" stroke-width="0.8"/>
<text x="563" y="253" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle" fill="#0C447C" >1.572</text>
<text x="588" y="253" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >acc（1×2）</text>
<text x="492" y="280" font-family="PingFang SC, sans-serif" font-size="9" fill="#888780" >l = 0.185 + 1.368 = 1.553</text>
<text x="492" y="302" font-family="PingFang SC, sans-serif" font-size="9" fill="#444441" >攒齐了，最后归一化：</text>
<rect x="492" y="310" width="176" height="26" rx="3" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.7"/>
<text x="580" y="327" font-family="PingFang SC, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle" fill="#04342C" >O = acc ÷ 1.553 = (2.750, 1.012)</text>
<line x1="226" y1="214" x2="250" y2="214" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<line x1="454" y1="214" x2="478" y2="214" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="24" y="386" width="656" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/>
<text x="40" y="404" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A" >验证：一次性算全局 softmax（max 取 4），权重 = [0.087, 0.032, 0.644, 0.237]，</text>
<text x="40" y="420" font-family="PingFang SC, sans-serif" font-size="10" fill="#2C2C2A" >O = 0.087·v₁ + 0.032·v₂ + 0.644·v₃ + 0.237·v₄ = (2.750, 1.012) —— 与分块的逐位相同，一个数不差。</text>
</svg>
