<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>自注意力运算流水线：从 (6,8) 出发，路过 (6,6)，回到 (6,8)</title>
<desc>上行把输入 X 投影成 Q、K、V；下行依次做缩放点积、因果掩码、行 softmax、加权求和、输出投影，形状从 (6,8) 变成 (6,6) 再变回 (6,8)。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">自注意力的运算流水线</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">进去是 6 个 token 的 8 维向量，中间变成一个 6×6 的"谁看谁"矩阵，出来还是 6 个 8 维向量</text>

<rect x="124" y="64" width="104" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="176" y="84" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">输入 X</text>
<text x="176" y="101" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#5F5E5A">6 × 8</text>

<rect x="288" y="64" width="104" height="54" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="84" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#412402">三个独立投影</text>
<text x="340" y="101" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#97590F">Wq · Wk · Wv</text>

<rect x="452" y="64" width="104" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="504" y="84" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Q、K、V</text>
<text x="504" y="101" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#185FA5">各 6 × 8</text>

<line x1="228" y1="91" x2="282" y2="91" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="392" y1="91" x2="446" y2="91" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>

<path d="M504 118 L504 150 L340 150 L340 194" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>

<rect x="20" y="200" width="104" height="66" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="72" y="220" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#0C447C">① 缩放点积</text>
<text x="72" y="239" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#185FA5">QKᵀ / √dk</text>
<text x="72" y="255" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#5F5E5A">Scores 6 × 6</text>

<rect x="154" y="200" width="104" height="66" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="206" y="220" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#712B13">② 因果掩码</text>
<text x="206" y="239" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#993C1D">j &gt; i → −∞</text>
<text x="206" y="255" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#5F5E5A">还是 6 × 6</text>

<rect x="288" y="200" width="104" height="66" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="340" y="220" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#412402">③ 逐行 softmax</text>
<text x="340" y="239" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#97590F">每行和 = 1</text>
<text x="340" y="255" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#5F5E5A">A 6 × 6</text>

<rect x="422" y="200" width="104" height="66" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="474" y="220" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#3C3489">④ 加权融合</text>
<text x="474" y="239" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#534AB7">A · V</text>
<text x="474" y="255" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#5F5E5A">回到 6 × 8</text>

<rect x="556" y="200" width="104" height="66" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="608" y="220" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#04342C">⑤ 输出投影</text>
<text x="608" y="239" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#0F6E56">× WO</text>
<text x="608" y="255" text-anchor="middle" font-family="Menlo, monospace" font-size="10.5" fill="#5F5E5A">O 6 × 8</text>

<line x1="124" y1="233" x2="148" y2="233" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="258" y1="233" x2="282" y2="233" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="392" y1="233" x2="416" y2="233" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>
<line x1="526" y1="233" x2="550" y2="233" stroke="#888780" stroke-width="1.2" marker-end="url(#ar1)"/>

<line x1="24" y1="292" x2="656" y2="292" stroke="#D3D1C7" stroke-width="1"/>

<rect x="24" y="308" width="10" height="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="42" y="317" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">36 个格子里，只有下三角 21 个合法（6+5+4+3+2+1），其余 15 个被打成 −∞</text>

<rect x="24" y="332" width="10" height="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="42" y="341" font-family="PingFang SC, sans-serif" font-size="11" fill="#2C2C2A">首尾形状都是 (n, d) —— 同形才能加残差，这是能一层层叠下去的前提</text>

<text x="24" y="372" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">注：⑤ 的 WO 是 (d, d)，所以它不会改变形状；多头的"切分—拼接"发生在 ① 之前，见第六节</text>
</svg>
