<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img">
<title>多头注意力：把 8 维切成 4 份并行开会，再拼回来</title>
<desc>d=8 被切成 4 个 2 维的头，每个头有独立的 Wq、Wk、Wv，各自算一份注意力，最后拼接成 8 维再乘 WO。四个头加起来参数量与单头相同。</desc>
<defs>
<marker id="ar5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">多头注意力：分成 4 个小组同时开小会</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">一个头只能给"它 → 放实习"打一个分；可它们之间同时存在语法、指代、主题、位置好几种关系</text>

<text x="33" y="74" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">d=8</text>
<rect x="24" y="84" width="18" height="46" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="24" y="130" width="18" height="46" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<rect x="24" y="176" width="18" height="46" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<rect x="24" y="222" width="18" height="46" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>

<rect x="76" y="84" width="212" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="90" y="103" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#0C447C">头 1｜语法组</text>
<text x="90" y="120" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#185FA5">只聊"谁是主语、谁是宾语"</text>

<rect x="76" y="130" width="212" height="46" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="90" y="149" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#412402">头 2｜指代组</text>
<text x="90" y="166" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#97590F">只聊"这个'它'到底指前面谁"</text>

<rect x="76" y="176" width="212" height="46" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="90" y="195" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#04342C">头 3｜主题组</text>
<text x="90" y="212" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0F6E56">只聊"这段整体在讲什么话题"</text>

<rect x="76" y="222" width="212" height="46" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="90" y="241" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#3C3489">头 4｜位置组</text>
<text x="90" y="258" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#534AB7">只聊"隔了几个词、在句首还是句尾"</text>

<line x1="42" y1="107" x2="70" y2="107" stroke="#888780" stroke-width="1" marker-end="url(#ar5)"/>
<line x1="42" y1="153" x2="70" y2="153" stroke="#888780" stroke-width="1" marker-end="url(#ar5)"/>
<line x1="42" y1="199" x2="70" y2="199" stroke="#888780" stroke-width="1" marker-end="url(#ar5)"/>
<line x1="42" y1="245" x2="70" y2="245" stroke="#888780" stroke-width="1" marker-end="url(#ar5)"/>

<text x="300" y="112" font-family="Menlo, monospace" font-size="9.5" fill="#2C2C2A">softmax(Q₁K₁ᵀ/√dk)V₁</text>
<text x="300" y="158" font-family="Menlo, monospace" font-size="9.5" fill="#2C2C2A">softmax(Q₂K₂ᵀ/√dk)V₂</text>
<text x="300" y="204" font-family="Menlo, monospace" font-size="9.5" fill="#2C2C2A">softmax(Q₃K₃ᵀ/√dk)V₃</text>
<text x="300" y="250" font-family="Menlo, monospace" font-size="9.5" fill="#2C2C2A">softmax(Q₄K₄ᵀ/√dk)V₄</text>

<text x="470" y="112" font-family="Menlo, monospace" font-size="9.5" fill="#5F5E5A">2 维</text>
<text x="470" y="158" font-family="Menlo, monospace" font-size="9.5" fill="#5F5E5A">2 维</text>
<text x="470" y="204" font-family="Menlo, monospace" font-size="9.5" fill="#5F5E5A">2 维</text>
<text x="470" y="250" font-family="Menlo, monospace" font-size="9.5" fill="#5F5E5A">2 维</text>

<path d="M510 107 L560 107 L560 180" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M510 153 L560 153" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M510 199 L560 199" fill="none" stroke="#888780" stroke-width="1"/>
<path d="M510 245 L560 245 L560 180" fill="none" stroke="#888780" stroke-width="1"/>
<line x1="560" y1="180" x2="602" y2="180" stroke="#888780" stroke-width="1" marker-end="url(#ar5)"/>
<text x="580" y="172" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#5F5E5A">Concat</text>

<rect x="606" y="160" width="50" height="40" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="631" y="184" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#444441">W_O</text>
<text x="631" y="216" text-anchor="middle" font-family="Menlo, monospace" font-size="9.5" fill="#5F5E5A">O 6×8</text>

<line x1="24" y1="290" x2="656" y2="290" stroke="#D3D1C7" stroke-width="1"/>

<text x="24" y="312" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">参数量没变：每个头的 Wq 是 (8, 2)，4 个头拼起来正好是 (8, 8)，和单头一样</text>
<text x="24" y="332" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">所以多头不是"多花参数"，是"把同样的参数切成几份用"；但切太细每份太窄，也学不出东西</text>
<text x="24" y="356" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">上图是 d=8 切成 4 个 2 维头的示意；真实模型常见 d=4096、h=32，每个头 128 维</text>
</svg>
