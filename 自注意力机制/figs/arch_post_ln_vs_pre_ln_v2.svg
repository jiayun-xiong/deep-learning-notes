<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img">
<title>Post-LN 与 Pre-LN 架构对比（修正版，标出两条绿线的真实起点）</title>
<desc>左图 post-LN 第二条绿线从 LN1 输出分叉，只绕过 FFN；右图 pre-LN 第二条绿线从第一个加号输出分叉，绕过 LN 和 FFN 两个方块。每条绿线序号左侧标注了它运送的数据：① 运 x，② 运 x′。</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="180" y="30" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Post-LN（2017 原版）</text>
<text x="180" y="52" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">先加残差，再归一化</text>
<text x="510" y="30" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Pre-LN（GPT / LLaMA）</text>
<text x="510" y="52" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">先归一化，再加残差</text>

<line x1="180" y1="66" x2="180" y2="436" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="180" y="66" text-anchor="middle" dominant-baseline="central" font-family="Menlo, monospace" font-size="12" fill="#2C2C2A">x (n×d)</text>
<rect x="118" y="74" width="4" height="4" fill="#1D9E75"/>

<rect x="130" y="100" width="100" height="38" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="180" y="119" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#0C447C">Attention</text>

<circle cx="180" cy="172" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<line x1="175" y1="172" x2="185" y2="172" stroke="#888780" stroke-width="1"/>
<line x1="180" y1="167" x2="180" y2="177" stroke="#888780" stroke-width="1"/>

<rect x="140" y="192" width="80" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="180" y="211" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">LayerNorm</text>

<rect x="178" y="252" width="4" height="4" fill="#1D9E75"/>

<rect x="140" y="274" width="80" height="38" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="180" y="293" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#444441">FFN</text>

<circle cx="180" cy="346" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<line x1="175" y1="346" x2="185" y2="346" stroke="#888780" stroke-width="1"/>
<line x1="180" y1="341" x2="180" y2="351" stroke="#888780" stroke-width="1"/>

<rect x="140" y="366" width="80" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="180" y="385" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">LayerNorm</text>
<text x="180" y="456" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">输出 → 下一层</text>

<path d="M180 80 L95 80 L95 172 L168 172" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<path d="M180 254 L122 254 L122 346 L168 346" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text x="81" y="128" text-anchor="end" dominant-baseline="central" font-family="Menlo, monospace" font-size="12" font-weight="500" fill="#0F6E56">x</text>
<circle cx="95" cy="128" r="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="95" y="128" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">1</text>
<text x="108" y="300" text-anchor="end" dominant-baseline="central" font-family="Menlo, monospace" font-size="12" font-weight="500" fill="#0F6E56">x′</text>
<circle cx="122" cy="300" r="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="122" y="300" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">2</text>
<text x="188" y="84" font-family="PingFang SC, sans-serif" font-size="11" fill="#0F6E56">起点 A：x 的分叉</text>
<text x="188" y="258" font-family="PingFang SC, sans-serif" font-size="11" fill="#0F6E56">起点 B：x′ = LN(x+Attn)，已被改写</text>

<line x1="510" y1="66" x2="510" y2="422" stroke="#888780" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="510" y="66" text-anchor="middle" dominant-baseline="central" font-family="Menlo, monospace" font-size="12" fill="#2C2C2A">x (n×d)</text>
<rect x="508" y="74" width="4" height="4" fill="#1D9E75"/>

<rect x="460" y="100" width="100" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="510" y="119" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">LayerNorm</text>
<rect x="460" y="155" width="100" height="38" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="510" y="174" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#0C447C">Attention</text>

<circle cx="510" cy="226" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<line x1="505" y1="226" x2="515" y2="226" stroke="#888780" stroke-width="1"/>
<line x1="510" y1="221" x2="510" y2="231" stroke="#888780" stroke-width="1"/>

<rect x="508" y="250" width="4" height="4" fill="#1D9E75"/>

<rect x="460" y="270" width="100" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="510" y="289" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">LayerNorm</text>
<rect x="460" y="323" width="100" height="38" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="510" y="342" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#444441">FFN</text>

<circle cx="510" cy="394" r="9" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<line x1="505" y1="394" x2="515" y2="394" stroke="#888780" stroke-width="1"/>
<line x1="510" y1="389" x2="510" y2="399" stroke="#888780" stroke-width="1"/>
<text x="510" y="442" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">输出 → 下一层</text>

<path d="M510 80 L425 80 L425 226 L498 226" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<path d="M510 250 L445 250 L445 394 L498 394" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text x="411" y="152" text-anchor="end" dominant-baseline="central" font-family="Menlo, monospace" font-size="12" font-weight="500" fill="#0F6E56">x</text>
<circle cx="425" cy="152" r="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="425" y="152" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">1</text>
<text x="431" y="322" text-anchor="end" dominant-baseline="central" font-family="Menlo, monospace" font-size="12" font-weight="500" fill="#0F6E56">x′</text>
<circle cx="445" cy="322" r="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="445" y="322" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="11" fill="#04342C">2</text>
<text x="518" y="84" font-family="PingFang SC, sans-serif" font-size="11" fill="#0F6E56">起点 A：x 的分叉</text>
<text x="518" y="254" font-family="PingFang SC, sans-serif" font-size="11" fill="#0F6E56">起点 B：x′ = x+Attn(LN)，未被改写</text>

<text x="180" y="488" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#993C1D">绿 ② 只绕过 FFN 一个方块（LN1 在分叉点之前的主干上）</text>
<text x="510" y="488" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#993C1D">绿 ② 绕过 LN + FFN 两个方块（LN 都在支路上）</text>
<text x="40" y="504" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">看绿 ② 从哪儿分叉：左图分叉点在 LN1 之后，右图分叉点在加号 1 之后——这就是 post 与 pre 的全部区别</text>
<text x="40" y="524" font-family="PingFang SC, sans-serif" font-size="11" fill="#0F6E56">序号左边的 x / x′ = 这条近道运送的数据：① 运进门原件 x，② 运 B 点上的 x′（两边同名不同义）</text>
</svg>
