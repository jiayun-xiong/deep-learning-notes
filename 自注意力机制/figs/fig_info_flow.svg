<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img">
<title>单向模型里信息如何一层层往前传</title>
<desc>第 1 层 token 3 只能看到 1 到 3；到第 2 层，token 4 能看到 1 到 4，而位置 3 上已经混入了 1、2 的信息，所以 token 4 间接拿到了更早的信息；每多一层，信息就能往前多传一跳。</desc>
<defs>
<marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">每多一层，信息往前多传一跳</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">单向模型里没有任何一步能"往回看"，所以远处信息只能靠层数一层层接力</text>

<!-- 第 1 层 -->
<text x="24" y="109" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">第 1 层</text>
<rect x="96" y="88" width="70" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="178" y="88" width="70" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="260" y="88" width="70" height="34" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
<rect x="342" y="88" width="70" height="34" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="424" y="88" width="70" height="34" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="506" y="88" width="70" height="34" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="131" y="109" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0C447C">科软</text>
<text x="213" y="109" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0C447C">放实习</text>
<text x="295" y="109" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="600" fill="#993C1D">它</text>
<text x="377" y="109" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">吸引</text>
<text x="459" y="109" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">学生</text>
<text x="541" y="109" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">报考</text>

<path d="M131 130 L131 138 L295 138 L295 130" fill="none" stroke="#BA7517" stroke-width="1"/>
<text x="304" y="142" font-family="PingFang SC, sans-serif" font-size="10" fill="#97590F">视野 = 前 3 个（含自己），后面看不见</text>

<line x1="295" y1="122" x2="295" y2="180" stroke="#888780" stroke-width="1.1" marker-end="url(#ar4)"/>
<line x1="541" y1="122" x2="541" y2="180" stroke="#888780" stroke-width="1.1" marker-end="url(#ar4)"/>
<text x="304" y="168" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">带着混合后的向量进入下一层</text>

<!-- 第 2 层 -->
<text x="24" y="211" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">第 2 层</text>
<rect x="96" y="190" width="70" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="178" y="190" width="70" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="260" y="190" width="70" height="34" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<rect x="342" y="190" width="70" height="34" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="424" y="190" width="70" height="34" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="506" y="190" width="70" height="34" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="131" y="211" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0C447C">科软</text>
<text x="213" y="211" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0C447C">放实习</text>
<text x="295" y="211" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#993C1D">它</text>
<text x="377" y="211" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="600" fill="#3C3489">吸引</text>
<text x="459" y="211" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">学生</text>
<text x="541" y="211" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">报考</text>

<path d="M131 232 L131 240 L377 240 L377 232" fill="none" stroke="#7F77DD" stroke-width="1"/>
<text x="386" y="244" font-family="PingFang SC, sans-serif" font-size="10" fill="#3C3489">"吸引"现在能看到前 4 个</text>

<line x1="377" y1="224" x2="377" y2="282" stroke="#888780" stroke-width="1.1" marker-end="url(#ar4)"/>
<text x="386" y="270" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">而位置 3 上的"它"已经混了 1、2 的信息</text>

<!-- 第 3 层 -->
<text x="24" y="313" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">第 3 层</text>
<rect x="96" y="292" width="70" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="178" y="292" width="70" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="260" y="292" width="70" height="34" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<rect x="342" y="292" width="70" height="34" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<rect x="424" y="292" width="70" height="34" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="506" y="292" width="70" height="34" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="131" y="313" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0C447C">科软</text>
<text x="213" y="313" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0C447C">放实习</text>
<text x="295" y="313" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#993C1D">它</text>
<text x="377" y="313" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#3C3489">吸引</text>
<text x="459" y="313" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">学生</text>
<text x="541" y="313" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="600" fill="#0F6E56">报考</text>

<path d="M131 334 L131 342 L541 342 L541 334" fill="none" stroke="#1D9E75" stroke-width="1"/>
<text x="550" y="330" text-anchor="start" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#0F6E56">全可见</text>

<text x="24" y="372" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">层数再多，第 1 个 token 也永远看不到第 6 个——方向是从前到后的，不会反向补</text>
</svg>
