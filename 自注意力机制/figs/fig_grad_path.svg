<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" height="424" role="img">
<title>post-LN 与 pre-LN 的梯度回传路径对比</title>
<desc>post-LN 的残差主干每层被 LN 打断，梯度回传要连乘 2L 个 LN；pre-LN 的主干是纯加法，梯度原样回传。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="36" y="56" width="608" height="152" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="52" y="80" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#633806">post-LN：残差主干每层被 LN 打断</text>
<text x="640" y="80" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="12" fill="#854F0B">梯度回传穿 2L 次</text>

<line x1="76" y1="126" x2="604" y2="126" stroke="#888780" stroke-width="1.5"/>
<circle cx="110" cy="126" r="5" fill="#444441"/>
<circle cx="235" cy="126" r="5" fill="#444441"/>
<circle cx="360" cy="126" r="5" fill="#444441"/>
<circle cx="485" cy="126" r="5" fill="#444441"/>

<rect x="150" y="113" width="44" height="26" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="172" y="126" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">LN</text>
<rect x="275" y="113" width="44" height="26" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="297" y="126" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">LN</text>
<rect x="400" y="113" width="44" height="26" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="422" y="126" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">LN</text>
<rect x="525" y="113" width="44" height="26" rx="6" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
<text x="547" y="126" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#412402">LN</text>

<line x1="172" y1="139" x2="172" y2="184" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="2 3"/>
<line x1="297" y1="139" x2="297" y2="184" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="2 3"/>
<line x1="422" y1="139" x2="422" y2="184" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="2 3"/>
<line x1="547" y1="139" x2="547" y2="184" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="2 3"/>

<line x1="594" y1="184" x2="80" y2="184" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="596" y="188" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" fill="#A32D2D">每站 × 雅可比：删掉 2 个方向，再乘 1/σ</text>

<rect x="36" y="222" width="608" height="152" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="52" y="246" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C">pre-LN：主干是纯加法，LN 只挂在分支上</text>
<text x="640" y="246" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="12" fill="#185FA5">主干 0 次</text>

<line x1="76" y1="292" x2="604" y2="292" stroke="#888780" stroke-width="1.5"/>
<circle cx="110" cy="292" r="5" fill="#444441"/>
<circle cx="235" cy="292" r="5" fill="#444441"/>
<circle cx="360" cy="292" r="5" fill="#444441"/>
<circle cx="485" cy="292" r="5" fill="#444441"/>

<rect x="88" y="312" width="44" height="26" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
<text x="110" y="325" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#042C53">LN</text>
<rect x="213" y="312" width="44" height="26" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
<text x="235" y="325" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#042C53">LN</text>
<rect x="338" y="312" width="44" height="26" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
<text x="360" y="325" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#042C53">LN</text>
<rect x="463" y="312" width="44" height="26" rx="6" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
<text x="485" y="325" text-anchor="middle" dominant-baseline="central" font-family="PingFang SC, sans-serif" font-size="12" fill="#042C53">LN</text>

<line x1="110" y1="297" x2="110" y2="312" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="2 3"/>
<line x1="235" y1="297" x2="235" y2="312" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="2 3"/>
<line x1="360" y1="297" x2="360" y2="312" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="2 3"/>
<line x1="485" y1="297" x2="485" y2="312" stroke="#378ADD" stroke-width="0.5" stroke-dasharray="2 3"/>

<line x1="594" y1="358" x2="80" y2="358" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="596" y="362" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" fill="#A32D2D">一路原样穿过去，只被加一次</text>

<text x="36" y="404" font-family="PingFang SC, sans-serif" font-size="11" fill="#5F5E5A">同样的参数扰动（σ=0.02）下梯度尺度的相对漂移：L=4 时 post-LN 更稳（0.48×），L=32 时是 pre-LN 的 2.4 倍</text>
</svg>
