<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img">
<title>因果掩码的 6×6 矩阵，以及掩码后的重新归一化</title>
<desc>左图是 6 个 token 的注意力矩阵：第 i 行只能看到第 1 到第 i 列，上三角 15 个格子是负无穷。右图对比掩码前后的权重，说明掩码是把后面几格从 softmax 分母里删掉，剩下的按原比例放大。</desc>
<defs>
<pattern id="hatch2" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
<rect width="6" height="6" fill="#F1EFE8"/>
<line x1="0" y1="0" x2="0" y2="6" stroke="#D3D1C7" stroke-width="1.4"/>
</pattern>
<marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">因果掩码：谁看得到谁，以及"看到"到底改变了什么</text>

<!-- ================= 左：矩阵 ================= -->
<text x="96" y="70" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">列 = 被看（K）　行 = 在找（Q）</text>

<text x="140" y="88" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">科软</text>
<text x="184" y="88" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">放实习</text>
<text x="228" y="88" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">它</text>
<text x="272" y="88" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">吸引</text>
<text x="316" y="88" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">学生</text>
<text x="360" y="88" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">报考</text>

<!-- 表头行标签 -->
<text x="88" y="118" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">科软</text>
<text x="88" y="162" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">放实习</text>
<text x="88" y="206" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10.5" font-weight="600" fill="#993C1D">它</text>
<text x="88" y="250" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">吸引</text>
<text x="88" y="294" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">学生</text>
<text x="88" y="338" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">报考</text>

<!-- 第 1 行 -->
<rect x="96" y="96" width="44" height="44" fill="#E6F1FB" stroke="#FFFFFF" stroke-width="1"/>
<text x="118" y="122" text-anchor="middle" font-family="Menlo, monospace" font-size="9.5" fill="#185FA5">1.00</text>
<rect x="140" y="96" width="220" height="44" fill="url(#hatch2)" stroke="#FFFFFF" stroke-width="1"/>
<text x="250" y="122" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#888780">−∞</text>

<!-- 第 2 行 -->
<rect x="96" y="140" width="88" height="44" fill="#E6F1FB" stroke="#FFFFFF" stroke-width="1"/>
<rect x="184" y="140" width="176" height="44" fill="url(#hatch2)" stroke="#FFFFFF" stroke-width="1"/>
<text x="272" y="166" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#888780">−∞</text>

<!-- 第 3 行（它） -->
<rect x="96" y="184" width="132" height="44" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="118" y="210" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#412402">0.13</text>
<text x="162" y="210" text-anchor="middle" font-family="Menlo, monospace" font-size="10" font-weight="600" fill="#993C1D">0.78</text>
<text x="206" y="210" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#412402">0.09</text>
<rect x="228" y="184" width="132" height="44" fill="url(#hatch2)" stroke="#FFFFFF" stroke-width="1"/>
<text x="294" y="210" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#888780">−∞</text>

<!-- 第 4 行 -->
<rect x="96" y="228" width="176" height="44" fill="#E6F1FB" stroke="#FFFFFF" stroke-width="1"/>
<rect x="272" y="228" width="88" height="44" fill="url(#hatch2)" stroke="#FFFFFF" stroke-width="1"/>
<text x="316" y="254" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#888780">−∞</text>

<!-- 第 5 行 -->
<rect x="96" y="272" width="220" height="44" fill="#E6F1FB" stroke="#FFFFFF" stroke-width="1"/>
<rect x="316" y="272" width="44" height="44" fill="url(#hatch2)" stroke="#FFFFFF" stroke-width="1"/>
<text x="338" y="298" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#888780">−∞</text>

<!-- 第 6 行（报考） -->
<rect x="96" y="316" width="264" height="44" fill="#E1F5EE" stroke="#FFFFFF" stroke-width="1"/>
<text x="118" y="342" text-anchor="middle" font-family="Menlo, monospace" font-size="9.5" fill="#0F6E56">0.10</text>
<text x="162" y="342" text-anchor="middle" font-family="Menlo, monospace" font-size="9.5" fill="#0F6E56">0.25</text>
<text x="206" y="342" text-anchor="middle" font-family="Menlo, monospace" font-size="9.5" fill="#0F6E56">0.05</text>
<text x="250" y="342" text-anchor="middle" font-family="Menlo, monospace" font-size="9.5" fill="#0F6E56">0.20</text>
<text x="294" y="342" text-anchor="middle" font-family="Menlo, monospace" font-size="9.5" fill="#0F6E56">0.35</text>
<text x="338" y="342" text-anchor="middle" font-family="Menlo, monospace" font-size="9.5" fill="#0F6E56">0.05</text>

<!-- 行注释 -->

<text x="96" y="392" font-family="Menlo, monospace" font-size="10.5" fill="#5F5E5A">合法 6+5+4+3+2+1 = 21</text>
<text x="250" y="392" font-family="Menlo, monospace" font-size="10.5" fill="#888780">掩掉 36 − 21 = 15</text>
<text x="96" y="414" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#993C1D">橙行 = 「它」3 格　绿行 = 「报考」6 格全可见</text>
<text x="96" y="432" font-family="PingFang SC, sans-serif" font-size="9.5" fill="#888780">空白蓝格 = 合法但未标数值（这里只举例写了第 3、6 行）</text>

<!-- ================= 右：归一化 ================= -->
<line x1="404" y1="60" x2="404" y2="440" stroke="#D3D1C7" stroke-width="1"/>

<text x="424" y="72" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">掩码不是"调小"，是"删掉"</text>

<text x="424" y="102" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">掩码前：它这一行对 6 个 token 的原始权重</text>
<rect x="424" y="110" width="34" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="441" y="127" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#0C447C">0.72</text>
<rect x="461" y="110" width="34" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="478" y="127" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#0C447C">0.12</text>
<rect x="498" y="110" width="34" height="26" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="515" y="127" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#0C447C">0.08</text>
<rect x="535" y="110" width="34" height="26" rx="4" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="552" y="127" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">0.04</text>
<rect x="572" y="110" width="34" height="26" rx="4" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="589" y="127" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">0.02</text>
<rect x="609" y="110" width="34" height="26" rx="4" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="626" y="127" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#888780">0.02</text>

<line x1="533" y1="123" x2="644" y2="123" stroke="#993C1D" stroke-width="1.2"/>
<text x="424" y="158" font-family="PingFang SC, sans-serif" font-size="10" fill="#993C1D">后三格变成 −∞，softmax 之后精确等于 0</text>

<text x="424" y="196" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">掩码后：只在剩下的 3 格里重新归一化</text>
<rect x="424" y="204" width="56" height="28" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="452" y="223" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#412402">0.13</text>
<rect x="486" y="204" width="56" height="28" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="514" y="223" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#412402">0.78</text>
<rect x="548" y="204" width="56" height="28" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="576" y="223" text-anchor="middle" font-family="Menlo, monospace" font-size="11" fill="#412402">0.09</text>
<text x="616" y="223" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0F6E56">和 = 1</text>

<text x="424" y="258" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#2C2C2A">换算就是把原来的三格除以它们自己的和 0.92：</text>
<text x="424" y="278" font-family="Menlo, monospace" font-size="10.5" fill="#2C2C2A">0.72 / 0.92 = 0.783</text>
<text x="424" y="296" font-family="Menlo, monospace" font-size="10.5" fill="#2C2C2A">0.12 / 0.92 = 0.130</text>
<text x="424" y="314" font-family="Menlo, monospace" font-size="10.5" fill="#2C2C2A">0.08 / 0.92 = 0.087</text>

<rect x="424" y="330" width="232" height="86" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="438" y="350" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">权重"变大"不是掩码在抬举谁：分母</text>
<text x="438" y="368" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">从 1 缩到 0.92，前三个只是按比例放大，</text>
<text x="438" y="386" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">谁都没被谁打压。那 8% 的自我成分也还</text>
<text x="438" y="404" font-family="PingFang SC, sans-serif" font-size="10" fill="#04342C">在，它后面几层还要靠。</text>

<text x="424" y="440" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">（这一行是示意数值，和第三节的讲解一致）</text>
</svg>
