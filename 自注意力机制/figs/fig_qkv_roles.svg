<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>Q、K、V 三个投影各管一件事</title>
<desc>同一份输入 X 分别乘 Wq、Wk、Wv 得到三个角色：Q 是"我在找什么"，K 是"我凭什么被找到"，V 是"我真给出去什么"。右侧说明为什么这三件事不能共用一个投影。</desc>
<defs>
<marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="24" y="26" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">一个 token，三份身份</text>
<text x="24" y="46" font-family="PingFang SC, sans-serif" font-size="11.5" fill="#5F5E5A">同一份输入，乘三个不共享的权重矩阵，变成三种完全不同的用途</text>

<text x="72" y="76" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">X（6 × 8）</text>
<rect x="24" y="84" width="96" height="168" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="72" y="108" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#444441">科软</text>
<text x="72" y="134" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#444441">放实习</text>
<text x="72" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" font-weight="600" fill="#993C1D">它</text>
<text x="72" y="186" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#444441">吸引</text>
<text x="72" y="212" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#444441">学生</text>
<text x="72" y="238" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#444441">报考</text>

<path d="M120 110 L196 96" fill="none" stroke="#185FA5" stroke-width="1.3" marker-end="url(#ar3)"/>
<path d="M120 168 L196 168" fill="none" stroke="#BA7517" stroke-width="1.3" marker-end="url(#ar3)"/>
<path d="M120 226 L196 240" fill="none" stroke="#1D9E75" stroke-width="1.3" marker-end="url(#ar3)"/>
<text x="158" y="92" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#185FA5">× Wq</text>
<text x="158" y="162" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#97590F">× Wk</text>
<text x="158" y="246" text-anchor="middle" font-family="Menlo, monospace" font-size="10" fill="#0F6E56">× Wv</text>

<rect x="204" y="64" width="188" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="298" y="84" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Q：我在找什么</text>
<text x="298" y="102" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#185FA5">检索用的表示</text>
<text x="298" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">它：我前面到底指的是谁</text>

<rect x="204" y="136" width="188" height="64" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="298" y="156" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#412402">K：我凭什么被找到</text>
<text x="298" y="174" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#97590F">被检索的表示</text>
<text x="298" y="191" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">放实习：我是培养方案里的政策点</text>

<rect x="204" y="208" width="188" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="298" y="228" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#04342C">V：我真给出去什么</text>
<text x="298" y="246" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#0F6E56">传输用的表示</text>
<text x="298" y="263" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#888780">研二可全职实习，不卡考勤</text>

<rect x="410" y="64" width="246" height="208" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="426" y="86" font-family="PingFang SC, sans-serif" font-size="11.5" font-weight="500" fill="#712B13">为什么不能共用一个矩阵？</text>
<text x="426" y="112" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#412402">① 检索的表示和传输的内容被强行绑死。</text>
<text x="426" y="130" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#412402">　　"我为什么被选中"和"选中后给出什么"</text>
<text x="426" y="148" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#412402">　　本来是两件事，绑在一起就互相拖累。</text>
<text x="426" y="176" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#412402">② 方向性消失。"我找你"和"你找我"</text>
<text x="426" y="194" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#412402">　　会算出同一个分数，注意力矩阵被迫</text>
<text x="426" y="212" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#412402">　　对称——而"谁在指代谁"天生是有向的。</text>
<text x="426" y="240" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#412402">③ 三个 W 都是 (8, 8)，参数不共享，</text>
<text x="426" y="258" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#412402">　　各有各的梯度，各学各的。</text>

<line x1="24" y1="292" x2="656" y2="292" stroke="#D3D1C7" stroke-width="1"/>

<text x="24" y="316" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">算分用的是 Q 和 K，混合用的是 V：</text>
<text x="24" y="338" font-family="Menlo, monospace" font-size="11" fill="#2C2C2A">Scores = Q·Kᵀ/√dk　　→ 谁和谁匹配</text>
<text x="24" y="358" font-family="Menlo, monospace" font-size="11" fill="#2C2C2A">O = softmax(Scores)·V　→ 匹配上之后拿到什么</text>
<text x="400" y="358" font-family="PingFang SC, sans-serif" font-size="10.5" fill="#888780">K 只参与打分，不进加权和</text>
</svg>
